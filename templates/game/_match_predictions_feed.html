<section
    class="match-predictions-feed"
    data-match-predictions-feed
    data-url="{% url 'game:match_predictions' slug=match.slug %}"
    aria-label="Прогнозы на матч"
>
    <div class="match-predictions-feed-head">
        <div>
            <p class="match-predictions-kicker">Мнения капперов</p>
            <h2>
                Все прогнозы на игру
                <span
                    class="match-predictions-total-badge"
                    data-match-predictions-total
                    aria-label="Всего прогнозов: {{ match_predictions_total }}"
                    style="display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:48px;padding:0 14px;margin-left:12px;border-radius:15px;background:var(--blue, #0b56fa);color:#fff;font-size:16px;font-weight:800;line-height:1;vertical-align:middle;box-sizing:border-box;"
                >{{ match_predictions_total }}</span>
            </h2>
        </div>
    </div>

    <div
        class="content-table-view predictions-table-view predictions-table-view-flat"
        data-match-predictions-block
        data-skeleton-block
    >
        <div class="content-table-scroll">
            <div class="content-table-head prediction-table-head" aria-hidden="true">
                <span>Матч</span>
                <span>Каппер</span>
                <span>Прогноз</span>
                <span>КФ</span>
                <span>Статус</span>
                <span></span>
            </div>
            <div class="prediction-table-body" data-match-predictions-list></div>
        </div>
    </div>

    <div class="match-predictions-loader" data-match-predictions-loader hidden>
        <span></span><span></span><span></span>
    </div>
    <div class="match-predictions-sentinel" data-match-predictions-sentinel aria-hidden="true"></div>
</section>
