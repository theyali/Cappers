{% comment %}The tournament choice of a coupon; coupon-tournament.js filters matches and marks positions by its rules.{% endcomment %}
<div class="coupon-tournament" data-coupon-tournament-field>
    <label class="coupon-tournament-select">
        <span class="coupon-tournament-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1.5A3.5 3.5 0 0 0 8.5 11M16 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8.5 20h7M10 17h4"/></svg></span>
        <select name="{{ select_name }}" aria-label="Турнир для прогноза" data-coupon-tournament>
            <option value="">Без турнира</option>
            {% for rule in tournament_rules %}<option value="{{ rule.id }}"{% if rule.id|stringformat:"s" == selected_tournament|stringformat:"s" %} selected{% endif %}>{{ rule.title }}</option>{% endfor %}
        </select>
        <span class="coupon-tournament-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
    </label>
    <p class="coupon-tournament-rules" data-coupon-tournament-rules hidden></p>
    {{ tournament_rules|json_script:"coupon-tournament-rules" }}
</div>
