{% load static %}
{% if achievement_badges %}
<div class="capper-pro-achievements expert-public-achievements" aria-label="Достижения эксперта">
    <span class="capper-pro-achievements-label">Достижения</span>
    <div class="capper-pro-achievements-list">
        {% for badge in achievement_badges %}
        <span
            class="capper-pro-achievement"
            data-achievement="{{ badge.key }}"
            title="{{ badge.description }}"
            aria-label="{{ badge.label }}. {{ badge.description }}"
        >
            <img src="{% static badge.icon %}" alt="">
        </span>
        {% endfor %}
    </div>
</div>
{% endif %}
