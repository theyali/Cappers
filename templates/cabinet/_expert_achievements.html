{% load static %}
{% if achievement_badges %}
<div class="capper-pro-achievements expert-public-achievements" aria-label="Последние достижения эксперта">
    <span class="capper-pro-achievements-label">Последние достижения</span>
    <div class="capper-pro-achievements-list">
        {% for badge in achievement_badges %}
        <span
            class="capper-pro-achievement"
            data-achievement="{{ badge.key }}"
            data-skeleton-image
            title="{{ badge.description }}"
            aria-label="{{ badge.label }}. {{ badge.description }}"
        >
            {% if badge.icon_url %}
            <img src="{{ badge.icon_url }}" width="48" height="48" alt="" loading="lazy">
            {% elif badge.icon %}
            <img src="{% static badge.icon %}" width="48" height="48" alt="" loading="lazy">
            {% else %}
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0V4ZM8 6H5v1a4 4 0 0 0 4 4M16 6h3v1a4 4 0 0 1-4 4M12 12v4M8 20h8M9 16h6v4H9z"></path></svg>
            {% endif %}
        </span>
        {% endfor %}
    </div>
</div>
{% endif %}
