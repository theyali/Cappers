{% extends "base.html" %}

{% block title %}Редактирование профиля — Cappers{% endblock %}

{% block content %}
<h1>Редактирование профиля</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ user_form.as_p }}

    {% if analyst_form %}
        <h2>Профиль аналитика</h2>
        {{ analyst_form.as_p }}
    {% endif %}

    <button type="submit">Сохранить</button>
</form>
{% endblock %}
