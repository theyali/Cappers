<div class="profile-demand-sort {{ sort_class }}" data-profile-coupon-sort-controls role="group" aria-label="Сортировать мои купоны">
    <button class="is-active" type="button" data-profile-coupon-sort="date" aria-pressed="true">Дата <span data-sort-arrow>↓</span></button>
    <button type="button" data-profile-coupon-sort="stake" aria-pressed="false">Сумма <span data-sort-arrow></span></button>
    <button type="button" data-profile-coupon-sort="payout" aria-pressed="false">Стоимость <span data-sort-arrow></span></button>
    <button type="button" data-profile-coupon-sort="likes" aria-pressed="false">Лайки <span data-sort-arrow></span></button>
    <button type="button" data-profile-coupon-sort="favorites" aria-pressed="false">Сохранили <span data-sort-arrow></span></button>
    <span class="profile-coupon-count" title="Всего купонов">{{ coupons_count }}</span>
</div>
