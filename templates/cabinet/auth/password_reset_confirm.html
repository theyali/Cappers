{% extends "base.html" %}

{% block title %}Новый пароль — Cappers{% endblock %}

{% block content %}
<h1>Новый пароль</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить пароль</button>
</form>
{% else %}
<p>Ссылка недействительна или уже использована.</p>
{% endif %}
{% endblock %}
