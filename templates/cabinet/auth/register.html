{% extends "base.html" %}

{% block title %}Регистрация — Cappers{% endblock %}

{% block content %}
<section class="auth-page long-bg long-bg-2">
    <div class="auth-card auth-card-wide">
        <p class="eyebrow">Новый аккаунт</p>
        <h1>Регистрация</h1>
        <form method="post" class="auth-form auth-form-grid">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label class="form-field">
                <span>{{ form.username.label }}</span>
                {{ form.username }}
                {{ form.username.errors }}
            </label>
            <label class="form-field">
                <span>{{ form.email.label }}</span>
                {{ form.email }}
                {{ form.email.errors }}
            </label>
            <label class="form-field">
                <span>{{ form.first_name.label }}</span>
                {{ form.first_name }}
                {{ form.first_name.errors }}
            </label>
            <label class="form-field">
                <span>{{ form.last_name.label }}</span>
                {{ form.last_name }}
                {{ form.last_name.errors }}
            </label>
            <label class="form-field">
                <span>{{ form.role.label }}</span>
                {{ form.role }}
                {{ form.role.errors }}
            </label>
            <label class="form-field">
                <span>{{ form.password1.label }}</span>
                {{ form.password1 }}
                {{ form.password1.errors }}
            </label>
            <label class="form-field">
                <span>{{ form.password2.label }}</span>
                {{ form.password2 }}
                {{ form.password2.errors }}
            </label>
            <button class="submit-button form-wide" type="submit">Создать аккаунт</button>
        </form>
        <div class="auth-links">
            <a href="{% url 'cabinet:login' %}">Уже есть аккаунт?</a>
        </div>
    </div>
</section>
{% endblock %}
