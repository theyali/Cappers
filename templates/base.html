<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cappers{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'front:index' %}">Cappers</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'cabinet:dashboard' %}">Кабинет</a>
                <a href="{% url 'cabinet:profile' %}">Профиль</a>
                <form method="post" action="{% url 'cabinet:logout' %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'cabinet:login' %}">Войти</a>
                <a href="{% url 'cabinet:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
