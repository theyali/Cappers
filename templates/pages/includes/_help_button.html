{% load static %}
{% with modal_slug=help_key|slugify %}
<button
    class="profile-row-action is-muted"
    type="button"
    data-site-help-trigger
    data-help-url="{% url 'pages:help_content' help_key %}"
    data-help-target="site-help-{{ modal_slug }}"
    {% if help_position %}data-help-position="{{ help_position }}"{% endif %}
    aria-haspopup="dialog"
    aria-controls="site-help-{{ modal_slug }}"
>
    <span class="nav-profile-dropdown-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.7 9a2.5 2.5 0 1 1 3.65 2.22c-.83.45-1.35 1.05-1.35 2.03"></path><path d="M12 17h.01"></path></svg>
    </span>
    <span>{{ help_label|default:"Помощь" }}</span>
</button>

<section
    class="profile-email-modal site-help-modal"
    id="site-help-{{ modal_slug }}"
    data-site-help-modal
    aria-hidden="true"
    aria-labelledby="site-help-title-{{ modal_slug }}"
>
    <div class="profile-email-modal-backdrop" data-site-help-close aria-hidden="true"></div>
    <div class="profile-email-modal-card profile-list-card" role="dialog" aria-modal="true" data-site-help-dialog>
        <button class="profile-email-modal-close" type="button" data-site-help-close aria-label="Закрыть помощь">×</button>
        <div class="profile-email-modal-head">
            <span class="profile-email-modal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.7 9a2.5 2.5 0 1 1 3.65 2.22c-.83.45-1.35 1.05-1.35 2.03"></path><path d="M12 17h.01"></path></svg>
            </span>
            <div>
                <p class="eyebrow">Справка</p>
                <h2 id="site-help-title-{{ modal_slug }}" data-site-help-title>Помощь</h2>
            </div>
        </div>
        <div data-site-help-content data-skeleton-block>
            <div class="profile-empty-state"><p>Загрузка справки…</p></div>
        </div>
    </div>
</section>
<script src="{% static 'front/js/help-modal.js' %}" defer></script>
{% endwith %}
