{% load static %}
<header class="telegram-app-header">
    <a class="telegram-app-brand" href="{% url 'front:index' %}" aria-label="КапперХаб — главная">
        <img src="{% static 'front/img/logo.png' %}" width="40" height="40" alt="" decoding="async">
    </a>
    {% if request.user.is_authenticated %}
        {% if nav_coin_balance is not None %}
            <div class="telegram-app-wallet">
                <span class="nav-wallet-balance">
                    {% include "front/includes/_coin_icon.html" %}
                    <strong data-wallet-balance>{{ nav_coin_balance_display }}</strong>
                </span>
                <a class="telegram-app-topup" href="{% url 'wallets:top_up' %}">Пополнить</a>
            </div>
        {% endif %}
        <button
            class="telegram-app-avatar"
            type="button"
            aria-label="Открыть меню"
            aria-controls="mobile-offcanvas"
            aria-expanded="false"
            data-mobile-offcanvas-toggle
        >
            {% if request.user.avatar %}
                <img src="{{ request.user.avatar.url }}" width="40" height="40" alt="" decoding="async">
            {% else %}
                <img src="{% static 'front/svgs/profile.svg' %}" width="24" height="24" alt="" decoding="async">
            {% endif %}
        </button>
    {% else %}
        <a class="telegram-app-topup" href="{% url 'cabinet:login' %}">Войти</a>
    {% endif %}
</header>
