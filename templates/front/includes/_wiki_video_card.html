<article
    class="wiki-video-card"
    role="button"
    tabindex="0"
    data-wiki-video-card
    data-video-url="{{ video.video.url }}"
    data-video-title="{{ video.title }}"
    aria-label="Смотреть видео: {{ video.title }}"
>
    <div class="wiki-video-preview" data-skeleton-image>
        {% if video.preview_image %}
            <img
                src="{{ video.preview_image.url }}"
                width="720"
                height="540"
                loading="lazy"
                alt="{{ video.title }}"
            >
        {% else %}
            <span class="wiki-video-preview-placeholder" aria-hidden="true">
                {% include "front/includes/_wiki_video_section_icon.html" with icon=video.section.icon %}
            </span>
        {% endif %}
        <span class="wiki-video-play" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="68" height="68" fill="currentColor">
                <path d="M9 7.2v9.6L17 12 9 7.2Z"></path>
            </svg>
        </span>
        <span
            class="wiki-video-duration"
            data-wiki-video-duration
            {% if not video.duration %}hidden{% endif %}
        >{{ video.duration }}</span>
    </div>

    <div class="wiki-video-copy">
        <div class="wiki-video-meta">
            <span class="wiki-video-category">{{ video.section.name }}</span>
            <span class="wiki-video-type">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                    <path d="M4 6h11a2 2 0 0 1 2 2v1.2l4-2.2v10l-4-2.2V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"></path>
                </svg>
                Видео
            </span>
        </div>

        <h3>{{ video.title }}</h3>
        <p>{{ video.description }}</p>
    </div>
</article>
