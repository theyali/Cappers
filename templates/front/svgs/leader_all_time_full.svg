<ellipse cx="101.5" cy="36.6" fill="var(--leader-metal-shadow)" rx="9.5" ry="4.6" transform="rotate(-58.9 101.5 36.6)">
</ellipse>{% endif %}<circle cx="50" cy="50" fill="var(--leader-metal)" r="33">
</circle>
<circle cx="50" cy="50" fill="var(--leader-inner)" r="27">
</circle>
<g transform="translate(50 38) scale(.42) translate(-50 -50)">
<path d="M50.0,29.0L55.3,42.7L70.0,43.5L58.6,52.8L62.3,67.0L50.0,59.0L37.7,67.0L41.4,52.8L30.0,43.5L44.7,42.7Z" fill="var(--leader-metal)">
</path>
</g>
<text fill="var(--leader-metal)" font-family="var(--font-display)" font-size="{{ badge.symbol_font_size }}" font-weight="800" text-anchor="middle" x="50" y="62">{{ badge.symbol_label }}</text>
</svg>
