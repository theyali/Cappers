{% load l10n %}<svg aria-hidden="true" class="expert-leader-badge-icon" focusable="false" height="{{ badge.height|unlocalize }}" viewBox="0 0 100 104" width="{{ badge.width|unlocalize }}">{% if badge.has_wreath %}<path d="M50 97Q6 92 3 30" fill="none" stroke="var(--leader-metal-shadow)" stroke-linecap="round" stroke-width="4">
</path>
<ellipse cx="35.0" cy="95.0" fill="var(--leader-metal-shadow)" rx="9.5" ry="4.6" transform="rotate(-189.1 35.0 95.0)">
</ellipse>
<ellipse cx="23.3" cy="89.5" fill="var(--leader-metal-shadow)" rx="9.5" ry="4.6" transform="rotate(-172.7 23.3 89.5)">
</ellipse>
<ellipse cx="13.7" cy="81.0" fill="var(--leader-metal-shadow)" rx="9.5" ry="4.6" transform="rotate(-155.8 13.7 81.0)">
</ellipse>
<ellipse cx="6.4" cy="69.3" fill="var(--leader-metal-shadow)" rx="9.5" ry="4.6" transform="rotate(-141.1 6.4 69.3)">
</ellipse>
