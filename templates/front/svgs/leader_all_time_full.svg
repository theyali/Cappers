</ellipse>
<path d="M50 97Q94 92 97 30" fill="none" stroke="var(--leader-metal-shadow)" stroke-linecap="round" stroke-width="4">
</path>
<ellipse cx="65.0" cy="95.0" fill="var(--leader-metal-shadow)" rx="9.5" ry="4.6" transform="rotate(9.1 65.0 95.0)">
