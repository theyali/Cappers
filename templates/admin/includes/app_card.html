{% load admin_dashboard %}
<a
    class="cappers-admin-app-card{% if app.key == 'seo' %} is-wide{% endif %}"
    href="{{ app.app_url }}"
    data-admin-app-card
    data-search="{{ app.title }} {{ app.subtitle }} {{ app.key }} {% for model in app.models %}{{ model.name }} {{ model.object_name }} {% endfor %}"
>
    <span class="cappers-admin-app-card-icon is-{{ app.color }}" data-admin-app="{{ app.key }}">
        {% admin_icon_svg app.icon %}
    </span>

    <span class="cappers-admin-app-card-copy">
        <strong>{{ app.title }}</strong>
        <small>{{ app.subtitle }}</small>
        <span>{{ app.model_count }} моделей</span>
    </span>

    <span class="cappers-admin-app-card-chevron">
        {% admin_icon_svg "chevron-right" %}
    </span>
</a>
