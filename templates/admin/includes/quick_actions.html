<section class="cappers-admin-panel" aria-labelledby="admin-quick-title">
    <div class="cappers-admin-panel-head">
        <div>
            <span class="cappers-admin-eyebrow">Частые задачи</span>
            <h2 id="admin-quick-title">Быстрые действия</h2>
        </div>
    </div>

    <div class="cappers-admin-quick-grid">
        {% for action in quick_actions %}
        <a href="{{ action.url }}" class="cappers-admin-quick-action">
            <span class="cappers-admin-quick-icon">
                {% include "admin/includes/_app_icon.html" with app_label=action.icon only %}
            </span>
            <span>
                <strong>{{ action.title }}</strong>
                <small>{{ action.subtitle }}</small>
            </span>
        </a>
        {% empty %}
        <div class="cappers-admin-empty-state">Нет доступных быстрых действий.</div>
        {% endfor %}
    </div>
</section>
