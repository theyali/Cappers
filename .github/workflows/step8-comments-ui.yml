name: Apply prediction comments UI step 8

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step8-comments-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply step 8 patch
        run: python .github/step8_apply.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify comments UI
        run: |
          node --check front/static/front/js/comments.js
          python manage.py check
          python manage.py shell -c "from django.template.loader import get_template; [get_template(name) for name in ('front/prediction_detail.html','front/includes/_coupon_reactions.html','front/includes/_comment_metric.html')]"
          git diff --check
      - name: Commit step 8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/prediction_views.py front/static/front/js/comments.js front/static/front/css/main.css templates/front/prediction_detail.html templates/front/includes/_coupon_reactions.html templates/front/includes/_comment_metric.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add prediction comments UI"
          git push
