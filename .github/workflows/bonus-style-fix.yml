name: Apply bonus card style update

on:
  push:
    paths:
      - .github/workflows/bonus-style-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update bonus card styles
        shell: bash
        run: |
          if ! grep -q "Bonus offer compact dark card" front/static/front/css/main.css; then
            cat >> front/static/front/css/main.css <<'CSS'

          /* Bonus offer compact dark card */
          .bonuses-page .bonus-offer-card {
              align-self: start;
              grid-template-rows: 190px auto;
              color: var(--text);
              background: var(--panel);
          }

          .bonuses-page .bonus-offer-media {
              position: relative;
              min-height: 0;
              aspect-ratio: auto;
              overflow: hidden;
              background: var(--ink);
          }

          .bonuses-page .bonus-offer-image {
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
          }

          .bonuses-page .bonus-offer-image img {
              width: 100%;
              height: 100%;
              display: block;
              object-fit: cover;
          }

          .bonuses-page .bonus-offer-placeholder {
              width: 100%;
              height: 100%;
              min-height: 0;
              display: grid;
              place-items: center;
              color: var(--muted);
              background: var(--ink);
          }

          .bonuses-page .bonus-offer-bookmaker-logo {
              position: absolute;
              top: 12px;
              left: 12px;
              z-index: 2;
              width: 76px;
              height: 34px;
              display: grid;
              place-items: center;
              padding: 4px 7px;
              overflow: hidden;
              border-radius: 9px;
              color: var(--text);
              background: var(--panel);
          }

          .bonuses-page .bonus-offer-bookmaker-logo img {
              width: 100%;
              height: 100%;
              display: block;
              object-fit: contain;
          }

          .bonuses-page .bonus-offer-body {
              min-width: 0;
              display: grid;
              grid-template-rows: auto;
              gap: 10px;
              padding: 15px;
              background: var(--panel);
          }

          .bonuses-page .bonus-offer-title {
              color: var(--text);
              font-size: 20px;
              line-height: 1.1;
          }

          .bonuses-page .bonus-offer-description {
              min-height: 0;
              display: -webkit-box;
              margin: 0;
              overflow: hidden;
              color: #a2a2a5;
              font-size: 12px;
              line-height: 1.45;
              -webkit-box-orient: vertical;
              -webkit-line-clamp: 3;
          }

          .bonuses-page .bonus-offer-code {
              min-height: 44px;
              padding: 8px 11px;
              border-radius: 11px;
              background: var(--ink);
          }

          .bonuses-page .bonus-offer-code span {
              font-size: 9px;
          }

          .bonuses-page .bonus-offer-code strong {
              color: var(--yellow);
              font-size: 14px;
          }

          .bonuses-page .bonus-offer-action {
              min-height: 44px;
              border-radius: 11px;
              background: var(--blue);
          }

          @media (max-width: 720px) {
              .bonuses-page .bonus-offer-card {
                  grid-template-rows: 190px auto;
              }

              .bonuses-page .bonus-offer-body {
                  padding: 14px;
              }
          }
          CSS
          fi

      - name: Commit style update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Cappers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add front/static/front/css/main.css
          git rm .github/workflows/bonus-style-fix.yml
          git commit -m "Compact dark bonus offer cards"
          git push origin HEAD:main
