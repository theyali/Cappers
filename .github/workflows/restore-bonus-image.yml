name: Restore bonus card image

on:
  push:
    paths:
      - .github/workflows/restore-bonus-image.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore compact bonus image row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("front/static/front/css/main.css")
          css = path.read_text(encoding="utf-8")
          old = '''.bonuses-page .bonus-offer-card {
              align-self: start;
              grid-template-rows: 190px auto;
              color: var(--text);
              background: var(--panel);
          }

          .bonuses-page .bonus-offer-media {
              position: relative;
              min-height: 0;
              aspect-ratio: auto;
              overflow: hidden;
              background: var(--ink);
          }'''
          new = '''.bonuses-page .bonus-offer-card {
              align-self: start;
              display: grid;
              grid-template-rows: 190px auto;
              color: var(--text);
              background: var(--panel);
          }

          .bonuses-page .bonus-offer-media {
              position: relative;
              width: 100%;
              height: 190px;
              min-height: 190px;
              display: block;
              aspect-ratio: auto;
              overflow: hidden;
              background: var(--ink);
          }'''
          if old not in css:
              raise SystemExit("bonus override block not found")
          css = css.replace(old, new, 1)
          path.write_text(css, encoding="utf-8")
          PY

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "Cappers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add front/static/front/css/main.css
          git rm .github/workflows/restore-bonus-image.yml
          git commit -m "Restore bonus offer image"
          git push origin HEAD:main
