name: Apply comment metrics UI step 7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step7-comment-metrics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply UI patch
        run: python .github/step7_apply.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Django and templates
        run: |
          python manage.py check
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "cappers.settings")
          import django
          django.setup()
          from django.template.loader import get_template
          for template_name in (
              "front/_prediction_card.html",
              "front/includes/_feed_prediction_card.html",
              "front/includes/_prediction_table_row.html",
              "front/includes/_comment_metric.html",
              "front/svgs/comment.svg",
          ):
              get_template(template_name)
          print("step7 templates compile")
          PY
          git diff --check
      - name: Commit step 7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            templates/front/_prediction_card.html \
            templates/front/includes/_feed_prediction_card.html \
            templates/front/includes/_prediction_table_row.html \
            templates/front/includes/_comment_metric.html \
            templates/front/svgs/comment.svg \
            front/static/front/css/main.css
          git commit -m "Add comment counters to prediction cards"
          git pull --rebase origin main
          git push origin HEAD:main
