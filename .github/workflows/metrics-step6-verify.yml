name: Verify persisted metrics step 6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics-step6-verify.yml

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cappers
          POSTGRES_USER: cappers
          POSTGRES_PASSWORD: cappers_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cappers -d cappers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DEBUG: "True"
      SECRET_KEY: test-metrics-step6
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: cappers
      POSTGRES_USER: cappers
      POSTGRES_PASSWORD: cappers_dev_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CACHE_URL: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply remaining metrics query patches
        run: python .github/metrics_step6_apply.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Metrics and comments tests
        run: |
          python manage.py test \
            front.test_metrics \
            cabinet.tests.test_prediction_comment_api \
            cabinet.tests.test_comment_model \
            cabinet.tests.test_comment_moderation \
            cabinet.tests.test_comment_anti_spam \
            notifications.test_match_watch
      - name: Ensure page queries use persisted metrics
        run: |
          ! grep -n 'likes_count=Count("likes"' front/prediction_views.py
          ! grep -n 'favorites_count=Count("favorites"' front/prediction_views.py
          ! grep -n 'Count("coupon__likes"' game/prediction_views.py
          ! grep -n 'predictions_count=Count(' front/home_views.py
          ! grep -n '_published_match_predictions_count' game/match_detail_views.py
      - name: Commit verified query patches
        run: |
          if git diff --quiet -- front/prediction_views.py front/home_views.py; then
            echo "No application patch to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/prediction_views.py front/home_views.py
          git commit -m "Use persisted metrics in prediction and match lists"
          git pull --rebase origin main
          git push origin HEAD:main
