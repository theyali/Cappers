name: Apply capper profile dashboard step 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-dashboard-step1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply profile dashboard step 1
        run: python .github/profile_step1_apply.py

      - name: Validate changed files
        run: |
          python -m compileall -q cabinet
          test ! -e front/static/front/css/temp.css
          test ! -e templates/cabinet/_profile_dashboard.html
          grep -q "profile-dashboard-head" templates/cabinet/profile.html
          grep -q "profile-pro-promo" front/static/front/css/main.css
          grep -Fq "CappersSkeleton?.watchImage(avatar)" front/static/front/js/profile.js

      - name: Commit step 1
        run: |
          rm .github/profile_step1_apply.py
          rm .github/workflows/profile-dashboard-step1.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Redesign capper profile hero and layout"
          git pull --rebase origin main
          git push origin HEAD:main
