name: Apply feed prediction actions layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/feed-actions-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/feed_actions_patch.py
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py shell -c "from django.template.loader import get_template; get_template('front/includes/_feed_prediction_card.html')"
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/front/includes/_feed_prediction_card.html front/static/front/css/main.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Match feed prediction action row to reference"
          git push
