name: Cleanup legacy VIP sidebar CSS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vip-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy VIP sidebar CSS
        run: python .github/vip_cleanup_apply.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/static/front/css/mobile.css
          git diff --cached --exit-code && exit 0
          git commit -m "Remove legacy VIP experts sidebar CSS"
          git push
