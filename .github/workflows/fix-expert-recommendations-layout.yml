name: Fix expert recommendations layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-expert-recommendations-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix recommendation cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('front/static/front/css/main.css')
          text = css.read_text(encoding='utf-8').rstrip()
          marker = '/* Expert recommendations VIP positioning fix */'
          block = r'''
/* Expert recommendations VIP positioning fix */
.expert-recommendations-track {
    align-items: stretch;
}

.expert-recommendation-card {
    height: 100%;
}

.expert-recommendation-avatar.is-vip {
    position: absolute;
}
'''
          if marker not in text:
              text += '\n\n' + block.strip() + '\n'
              css.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-expert-recommendations-layout.yml

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: align expert recommendation cards"
          git push origin main
