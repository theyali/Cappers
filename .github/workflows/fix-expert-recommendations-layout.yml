name: Fix expert recommendations layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-expert-recommendations-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout fix
        run: |
          cat >> front/static/front/css/main.css <<'CSS'

          /* Expert recommendations VIP positioning fix */
          .expert-recommendations-track {
              align-items: stretch;
          }

          .expert-recommendation-card {
              height: 100%;
          }

          .expert-recommendation-avatar.is-vip {
              position: absolute;
          }
          CSS
          rm -f .github/workflows/fix-expert-recommendations-layout.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align expert recommendation cards"
          git push origin main
