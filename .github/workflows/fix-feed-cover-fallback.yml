name: Fix feed cover fallback

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-feed-cover-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply fallback background only without cover image
        run: |
          python3 -c "from pathlib import Path; p=Path('front/static/front/css/main.css'); s=p.read_text(); rule='\n\n/* Feed fallback background is visible only when there is no cover image. */\n.prediction-card.feed-prediction-card .feed-prediction-cover-image + .feed-prediction-cover-fallback {\n    background: transparent;\n}\n'; p.write_text(s if '.feed-prediction-cover-image + .feed-prediction-cover-fallback' in s else s.rstrip()+rule+'\n')"

      - name: Commit changes
        run: |
          git config user.name "Ali Hajiyev"
          git config user.email "83508265+theyali@users.noreply.github.com"
          git add front/static/front/css/main.css
          git diff --cached --quiet && exit 0
          git commit -m "Show feed fallback background only without cover"
          git push origin main
