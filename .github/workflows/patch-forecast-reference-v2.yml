name: Patch forecast reference v2

on:
  push:
    paths:
      - ".github/workflows/patch-forecast-reference-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch forecast markup and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          template_path = Path("templates/front/index.html")
          template = template_path.read_text(encoding="utf-8")

          forecast_area = r'''    <div class="forecast-area">
        <div class="home-heading">
            <div class="home-heading-copy">
                <p class="home-eyebrow">Свежая лента</p>
                <h1>Последние <mark>прогнозы</mark></h1>
                <p class="home-heading-subtitle">Актуальные прогнозы от проверенных экспертов. Следи, анализируй, выигрывай.</p>
            </div>
            <div class="slider-actions" aria-label="Управление слайдером">
                <button class="slider-arrow" type="button" data-slider-prev aria-label="Предыдущий прогноз">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="slider-arrow slider-arrow-accent" type="button" data-slider-next aria-label="Следующий прогноз">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="forecast-slider" data-forecast-slider data-direction="next">
            {% if latest_predictions %}
            <div class="forecast-track">
                {% for prediction in latest_predictions %}
                <article class="forecast-slide{% if forloop.first %} is-active{% endif %}" data-slide aria-hidden="{% if forloop.first %}false{% else %}true{% endif %}">
                    <div class="forecast-topline">
                        <div class="forecast-expert">
                            <span class="forecast-avatar" data-skeleton-image>
                                {% capper_trust_badge prediction.expert_trust_index %}
                                {% if prediction.expert_avatar_url %}
                                    <img src="{{ prediction.expert_avatar_url }}" alt="" loading="lazy" width="58" height="58">
                                {% else %}
                                    <span class="forecast-avatar-initials">{{ prediction.expert_initials }}</span>
                                {% endif %}
                            </span>
                            <div>
                                <strong>
                                    {{ prediction.expert }}
                                    {% if prediction.expert_verified %}
                                    <span class="forecast-verified" title="Проверенный эксперт" aria-label="Проверенный эксперт">
                                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                            <path d="M10 1.8l2.05 1.35 2.45-.13 1.08 2.2 2.08 1.3-.38 2.43.86 2.3-1.68 1.79-.12 2.45-2.34.76-1.48 1.96L10 17.5l-2.52.71L6 16.25l-2.34-.76-.12-2.45-1.68-1.79.86-2.3-.38-2.43 2.08-1.3 1.08-2.2 2.45.13L10 1.8Z" fill="currentColor"/>
                                            <path d="m6.8 10.1 2.05 2.05 4.35-4.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </span>
                                    {% endif %}
                                </strong>
                                <span>Эксперт КапперХаб</span>
                            </div>
                        </div>
                        <div class="forecast-meta">
                            <span>{{ prediction.sport }}</span>
                            <span class="forecast-league-meta">
                                {% if prediction.league_logo %}
                                <span class="forecast-league-logo" data-skeleton-image>
                                    <img src="{{ prediction.league_logo }}" alt="" loading="lazy" width="20" height="20">
                                </span>
                                {% else %}
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M4 19V9l4-3 4 3 4-5 4 3v12H4Z" fill="#2dbd87"/>
                                    <path d="M8 19v-5m4 5v-7m4 7v-9" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                                {% endif %}
                                {{ prediction.league }}
                            </span>
                        </div>
                    </div>

                    <a class="forecast-matchup" href="{{ prediction.url }}" aria-label="Открыть матч {{ prediction.home_name }} — {{ prediction.away_name }}">
                        <div class="forecast-team forecast-team-home">
                            <span class="forecast-team-logo" data-skeleton-image>
                                {% if prediction.home_logo %}
                                    <img src="{{ prediction.home_logo }}" alt="Логотип {{ prediction.home_name }}" loading="lazy" width="112" height="112">
                                {% else %}
                                    {{ prediction.home_name|slice:":1" }}
                                {% endif %}
                            </span>
                            <div class="forecast-team-copy">
                                <strong>{{ prediction.home_name }}</strong>
                                <span class="forecast-league-meta">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M5 19v-6m4 6V8m5 11V5m5 14v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                    {{ prediction.league }}
                                </span>
                            </div>
                        </div>
                        <span class="forecast-vs">VS</span>
                        <div class="forecast-team forecast-team-away">
                            <span class="forecast-team-logo" data-skeleton-image>
                                {% if prediction.away_logo %}
                                    <img src="{{ prediction.away_logo }}" alt="Логотип {{ prediction.away_name }}" loading="lazy" width="112" height="112">
                                {% else %}
                                    {{ prediction.away_name|slice:":1" }}
                                {% endif %}
                            </span>
                            <div class="forecast-team-copy">
                                <strong>{{ prediction.away_name }}</strong>
                                <span class="forecast-league-meta">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M5 19v-6m4 6V8m5 11V5m5 14v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                    {{ prediction.league }}
                                </span>
                            </div>
                        </div>
                    </a>

                    <div class="forecast-body">
                        <a class="forecast-match-copy forecast-real-copy forecast-match-link" href="{{ prediction.url }}">
                            <p class="forecast-label">Матч</p>
                            <h2>{{ prediction.home_name }} — {{ prediction.away_name }}</h2>
                            <div class="forecast-match-details">
                                <span class="forecast-match-detail">
                                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <strong>{{ prediction.starts_at }}</strong>
                                </span>
                                <span class="forecast-match-detail">
                                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                        <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/>
                                    </svg>
                                    <strong>{{ prediction.league }}</strong>
                                </span>
                                <span class="forecast-result is-{{ prediction.status_key }}">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                                        <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    {{ prediction.status_label }}
                                </span>
                            </div>
                            <div class="forecast-note">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M4 19v-6m4 6V9m4 10V5m4 14v-8m4 8V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                                </svg>
                                <span>Статистика игроков, форма и актуальные коэффициенты в одном месте</span>
                                <span class="forecast-note-arrow" aria-hidden="true">›</span>
                            </div>
                        </a>

                        <div class="forecast-pick-column">
                            <div class="forecast-pick-card">
                                <span>Прогноз</span>
                                <strong>{{ prediction.pick }}</strong>
                                <small class="forecast-market">{{ prediction.market }}</small>
                                <div class="forecast-coefficient">
                                    <small>Коэффициент</small>
                                    <b>{{ prediction.coefficient }}</b>
                                </div>
                            </div>
                            <a class="forecast-open-match" href="{% url 'front:prediction_detail' prediction.id %}">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M5.5 8.5 8.5 5.5l2 2 6-6 6 6-6 6 2 2-3 3-2-2-6 6-6-6 6-6-2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Посмотреть купон</span>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M6 12h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </article>
                {% endfor %}
            </div>

            <div class="slider-footer">
                <div class="slider-dots" role="tablist" aria-label="Выбор прогноза">
                    {% for prediction in latest_predictions %}
                    <button class="slider-dot{% if forloop.first %} is-active{% endif %}" type="button" data-slider-dot="{{ forloop.counter0 }}" aria-label="Прогноз {{ forloop.counter }}" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"></button>
                    {% endfor %}
                </div>
                <div class="slider-progress" aria-hidden="true">
                    <span data-slider-progress></span>
                </div>
                <span class="slider-counter"><b data-slider-current>01</b> / {{ latest_predictions|length|stringformat:"02d" }}</span>
            </div>
            {% else %}
            <div class="forecast-empty">
                <strong>Опубликованных прогнозов пока нет</strong>
                <p>Как только капперы опубликуют первый прогноз, он автоматически появится в этом слайдере.</p>
            </div>
            {% endif %}
        </div>
    </div>'''

          start = template.index('    <div class="forecast-area">')
          end = template.index('\n    <aside class="home-sidebar">', start)
          template = template[:start] + forecast_area + template[end:]
          template_path.write_text(template, encoding="utf-8")

          main_marker = "/* Forecast reference alignment v2 */"
          main_css = r'''
.home-heading {
    min-height: 148px;
    align-items: flex-end;
    margin-bottom: 22px;
}

.home-heading-copy {
    min-width: 0;
}

.home-heading h1 {
    max-width: none;
    font-size: clamp(46px, 4.7vw, 68px);
    line-height: .96;
}

.home-heading-subtitle {
    max-width: 900px;
    margin: 15px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.45;
}

.slider-actions {
    gap: 12px;
    padding-bottom: 18px;
}

.slider-arrow {
    width: 60px;
    height: 60px;
    border-radius: 18px;
}

.forecast-slider {
    min-height: 790px;
    padding: 22px;
    border-radius: 28px;
    background: var(--panel);
}

.forecast-slide {
    min-height: 650px;
    padding: 28px 32px;
    border-radius: 22px;
    background: #171718;
}

.forecast-topline {
    min-height: 72px;
}

.forecast-expert {
    gap: 14px;
}

.forecast-avatar {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    font-size: 14px;
}

.forecast-expert strong {
    display: flex;
    align-items: center;
    font-size: 18px;
}

.forecast-expert > div > span {
    margin-top: 5px;
    font-size: 13px;
}

.forecast-meta {
    gap: 10px;
}

.forecast-meta > span:first-child,
.forecast-meta > .forecast-league-meta {
    min-height: 42px;
    padding: 0 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
}

.forecast-meta > span:first-child {
    color: #fff;
    background: var(--blue);
}

.forecast-meta > .forecast-league-meta {
    color: rgba(255, 255, 255, .76);
    background: #28282b;
}

.forecast-meta .forecast-league-logo {
    width: 20px;
    height: 20px;
    min-height: 20px;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border-radius: 5px;
    color: inherit;
    background: transparent;
}

.forecast-meta .forecast-league-logo img {
    width: 20px;
    height: 20px;
}

.forecast-matchup {
    min-height: 190px;
    grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
    gap: 28px;
    margin-top: 28px;
    padding: 20px 26px;
    border-radius: 22px;
    background: #202022;
}

.forecast-team,
.forecast-team-away {
    min-width: 0;
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr);
    align-items: center;
    justify-content: stretch;
    gap: 22px;
    text-align: left;
}

.forecast-team-logo {
    width: 112px;
    height: 112px;
    border-radius: 24px;
    background: #2a2a2d;
}

.forecast-team-logo img {
    width: 86%;
    height: 86%;
}

.forecast-team-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
}

.forecast-team strong {
    width: 100%;
    overflow: visible;
    color: var(--text);
    font-size: clamp(24px, 2.25vw, 34px);
    line-height: 1.05;
    white-space: normal;
    text-overflow: clip;
}

.forecast-team .forecast-league-meta {
    width: fit-content;
    min-height: 36px;
    display: inline-flex !important;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-radius: 12px;
    color: rgba(255, 255, 255, .76);
    background: #303033;
    font-size: 13px;
    font-weight: 700;
}

.forecast-team .forecast-league-meta svg {
    color: rgba(255, 255, 255, .78);
}

.forecast-vs {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    font-size: 15px;
    letter-spacing: .03em;
}

.forecast-body {
    grid-template-columns: minmax(0, 1.22fr) minmax(330px, .88fr);
    gap: 38px;
    align-items: stretch;
    margin-top: 0;
    padding-top: 28px;
}

.forecast-match-copy {
    min-width: 0;
    justify-content: flex-start;
    padding-top: 20px;
}

.forecast-label {
    margin-bottom: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
}

.forecast-match-copy h2 {
    max-width: none;
    font-size: clamp(25px, 2.3vw, 36px);
    line-height: 1.08;
}

.forecast-match-details {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 24px;
    margin-top: 28px;
}

.forecast-match-detail {
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: rgba(255, 255, 255, .72);
}

.forecast-match-detail svg {
    flex: 0 0 auto;
    color: rgba(255, 255, 255, .62);
}

.forecast-match-detail strong {
    color: rgba(255, 255, 255, .78);
    font-size: 14px;
    font-weight: 700;
}

.forecast-result {
    min-height: 42px;
    gap: 8px;
    padding: 0 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
}

.forecast-note {
    width: 100%;
    max-width: none;
    min-height: 88px;
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) 24px;
    align-items: center;
    gap: 16px;
    margin: 28px 0 0;
    padding: 16px 20px;
    border-radius: 16px;
    color: rgba(255, 255, 255, .7);
    background: #202022;
    font-size: 13px;
    line-height: 1.5;
}

.forecast-note > svg {
    color: rgba(255, 255, 255, .88);
}

.forecast-note-arrow {
    color: rgba(255, 255, 255, .62);
    font-size: 31px;
    line-height: 1;
    text-align: right;
}

.forecast-pick-column {
    min-width: 0;
    display: grid;
    grid-template-rows: minmax(250px, 1fr) 66px;
    gap: 14px;
}

.forecast-pick-card {
    min-height: 250px;
    padding: 26px 30px;
    border-radius: 20px;
}

.forecast-pick-card > span {
    font-size: 12px;
    font-weight: 800;
}

.forecast-pick-card > strong {
    margin-top: 13px;
    font-size: clamp(27px, 2.45vw, 38px);
}

.forecast-market {
    margin-top: 10px;
    font-size: 14px;
}

.forecast-coefficient {
    margin-top: auto;
    padding-top: 20px;
    box-shadow: inset 0 1px 0 rgba(19, 19, 19, .16);
}

.forecast-coefficient small {
    font-size: 13px;
}

.forecast-coefficient b {
    font-size: 58px;
}

.forecast-open-match {
    width: 100%;
    min-height: 66px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 0 22px;
    border-radius: 18px;
    color: #fff;
    background: var(--blue);
    font-size: 15px;
    font-weight: 800;
}

.forecast-open-match svg {
    flex: 0 0 auto;
}

.slider-footer {
    min-height: 76px;
    padding: 18px 8px 0;
}

.slider-dot {
    width: 10px;
    height: 10px;
}

.slider-dot.is-active {
    width: 38px;
}

.slider-counter {
    font-size: 14px;
}
'''

          main_path = Path("front/static/front/css/main.css")
          main_text = main_path.read_text(encoding="utf-8")
          if main_marker in main_text:
              main_text = main_text.split(main_marker, 1)[0].rstrip()
          main_path.write_text(main_text + "\n\n" + main_marker + "\n" + main_css.strip() + "\n", encoding="utf-8")

          mobile_marker = "/* Forecast reference responsive v2 */"
          mobile_css = r'''
@media (max-width: 820px) {
    .home-heading {
        min-height: 0;
        margin-bottom: 18px;
    }

    .home-heading h1 {
        font-size: clamp(38px, 8vw, 50px);
    }

    .home-heading-subtitle {
        max-width: 100%;
        margin-top: 11px;
        font-size: 13px;
    }

    .slider-actions {
        padding-bottom: 0;
    }

    .forecast-slider {
        min-height: 0;
        padding: 0;
        border-radius: 20px;
    }

    .forecast-slide {
        min-height: 0;
        padding: 22px;
        border-radius: 18px;
    }

    .forecast-topline {
        min-height: 0;
        align-items: flex-start;
        flex-direction: column;
    }

    .forecast-meta {
        justify-content: flex-start;
    }

    .forecast-matchup {
        min-height: 0;
        grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
        gap: 14px;
        padding: 16px;
    }

    .forecast-team,
    .forecast-team-away {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 10px;
        text-align: center;
    }

    .forecast-team-logo {
        width: 76px;
        height: 76px;
        border-radius: 20px;
    }

    .forecast-team-copy {
        align-items: center;
        gap: 9px;
    }

    .forecast-team strong {
        font-size: 18px;
        text-align: center;
    }

    .forecast-team .forecast-league-meta {
        min-height: 30px;
        padding: 0 9px;
        font-size: 10px;
    }

    .forecast-vs {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        font-size: 11px;
    }

    .forecast-body {
        grid-template-columns: 1fr;
        gap: 18px;
