    }

    .forecast-match-copy {
        padding-top: 0;
    }

    .forecast-match-details {
        gap: 10px 16px;
        margin-top: 20px;
    }

    .forecast-note {
        min-height: 76px;
        margin-top: 18px;
        padding: 14px 16px;
    }

    .forecast-pick-column {
        grid-template-rows: auto 56px;
        gap: 12px;
    }

    .forecast-open-match {
        min-height: 56px;
        border-radius: 14px;
    }
}

@media (max-width: 560px) {
    .home-heading {
        gap: 12px;
    }

    .home-heading h1 {
        font-size: 34px;
    }

    .home-heading-subtitle {
        font-size: 12px;
    }

    .slider-arrow {
        width: 44px;
        height: 44px;
        border-radius: 13px;
    }

    .forecast-slide {
        padding: 16px;
    }

    .forecast-avatar {
        width: 50px;
        height: 50px;
    }

    .forecast-expert strong {
        font-size: 15px;
    }

    .forecast-meta > span:first-child,
    .forecast-meta > .forecast-league-meta {
        min-height: 34px;
        padding: 0 10px;
        font-size: 11px;
    }

    .forecast-matchup {
        grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr);
        gap: 8px;
        margin-top: 16px;
        padding: 12px;
    }

    .forecast-team-logo {
        width: 58px;
        height: 58px;
        border-radius: 16px;
    }

    .forecast-team strong {
        font-size: 14px;
    }

    .forecast-team .forecast-league-meta {
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .forecast-vs {
        width: 40px;
        height: 40px;
        font-size: 9px;
    }

    .forecast-match-copy h2 {
        font-size: 24px;
