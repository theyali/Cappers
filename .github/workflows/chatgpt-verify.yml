name: Temporary ChatGPT verification

on:
  push:
    branches:
      - chatgpt/sport-league-footer-settlement
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cappers_test
          POSTGRES_USER: cappers
          POSTGRES_PASSWORD: cappers_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cappers -d cappers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "0"
      POSTGRES_DB: cappers_test
      POSTGRES_USER: cappers
      POSTGRES_PASSWORD: cappers_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CACHE_URL: redis://127.0.0.1:6379/2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q cabinet game front back cappers pages wallets achievements notifications tournaments bots
      - name: Django check
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Targeted tests
        run: python manage.py test cabinet.test_sport_league_preferences game.test_manual_match_review
