name: Apply wiki video styles

on:
  push:
    paths:
      - ".github/workflows/wiki-video-css-patch.yml"

permissions:
  contents: write

jobs:
  patch-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append wiki video desktop styles
        shell: bash
        run: |
          cat <<'CSS' >> front/static/front/css/main.css

          /* Wiki video library */
          .wiki-videos-section {
              scroll-margin-top: 96px;
              padding: 34px 6px 12px;
          }

          .wiki-videos-heading {
              max-width: 980px;
          }

          .wiki-videos-kicker {
              margin: 0 0 10px;
              color: var(--yellow);
              font-size: 12px;
              font-weight: 800;
              letter-spacing: .12em;
              text-transform: uppercase;
          }

          .wiki-videos-heading h2 {
              margin: 0;
              color: var(--text);
              font-size: 48px;
              line-height: 1;
              letter-spacing: -.035em;
          }

          .wiki-videos-lead {
              margin: 16px 0 0;
              color: rgba(255, 255, 255, .64);
              font-size: 15px;
              line-height: 1.55;
          }

          .wiki-video-filters {
              display: flex;
              flex-wrap: wrap;
              gap: 12px;
              margin-top: 30px;
          }

          .wiki-video-filter {
              min-height: 54px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 10px;
              padding: 0 24px;
              border-radius: 16px;
              color: rgba(255, 255, 255, .76);
              background: var(--panel);
              font-size: 14px;
              font-weight: 700;
              white-space: nowrap;
              transition: background .18s ease, color .18s ease, transform .18s ease;
          }

          .wiki-video-filter:hover {
              color: #fff;
              background: #29292c;
              transform: translateY(-1px);
          }

          .wiki-video-filter.is-active,
          .wiki-video-filter.is-active:hover {
              color: #fff;
              background: var(--blue);
          }

          .wiki-video-filter-icon {
              width: 20px;
              height: 20px;
              flex: 0 0 20px;
              display: grid;
              place-items: center;
          }

          .wiki-video-filter-icon svg {
              width: 100%;
              height: 100%;
          }

          .wiki-video-grid {
              display: grid;
              grid-template-columns: repeat(4, minmax(0, 1fr));
              gap: 16px;
              margin-top: 30px;
          }

          .wiki-video-card {
              min-width: 0;
              display: flex;
              flex-direction: column;
              overflow: hidden;
              border-radius: 16px;
              background: var(--panel);
          }

          .wiki-video-preview {
              position: relative;
              aspect-ratio: 1.23 / 1;
              display: block;
              overflow: hidden;
              color: #fff;
              background: #171718;
          }

          .wiki-video-preview img {
              width: 100%;
              height: 100%;
              display: block;
              object-fit: cover;
          }

          .wiki-video-preview-placeholder {
              width: 100%;
              height: 100%;
              display: grid;
              place-items: center;
              color: var(--blue);
              background: #171718;
          }

          .wiki-video-preview-placeholder svg {
              width: 76px;
              height: 76px;
          }

          .wiki-video-play {
              position: absolute;
              top: 50%;
              left: 50%;
              width: 66px;
              height: 66px;
              display: grid;
              place-items: center;
              border-radius: 50%;
              color: #fff;
              background: var(--panel);
              transform: translate(-50%, -50%);
              transition: background .18s ease, transform .18s ease;
          }

          .wiki-video-preview:hover .wiki-video-play {
              background: var(--blue);
              transform: translate(-50%, -50%) scale(1.04);
          }

          .wiki-video-duration {
              position: absolute;
              right: 12px;
              bottom: 12px;
              min-height: 25px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              padding: 0 8px;
              border-radius: 7px;
              color: #fff;
              background: var(--ink);
              font-size: 12px;
              font-weight: 800;
              font-variant-numeric: tabular-nums;
          }

          .wiki-video-copy {
              min-height: 246px;
              display: flex;
              flex: 1;
              flex-direction: column;
              padding: 18px 20px 20px;
          }

          .wiki-video-meta {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 12px;
              font-size: 11px;
              font-weight: 800;
              letter-spacing: .02em;
              text-transform: uppercase;
          }

          .wiki-video-category {
              overflow: hidden;
              color: var(--blue);
              text-overflow: ellipsis;
              white-space: nowrap;
          }

          .wiki-video-type {
              flex: 0 0 auto;
              display: inline-flex;
              align-items: center;
              gap: 6px;
              color: rgba(255, 255, 255, .56);
          }

          .wiki-video-type svg {
              width: 16px;
              height: 16px;
          }

          .wiki-video-copy h3 {
              margin: 16px 0 0;
              color: var(--text);
              font-size: 20px;
              line-height: 1.18;
              letter-spacing: -.02em;
          }

          .wiki-video-copy h3 a {
              color: inherit;
          }

          .wiki-video-copy p {
              margin: 12px 0 20px;
              color: rgba(255, 255, 255, .58);
              font-size: 13px;
              line-height: 1.65;
          }

          .wiki-video-watch {
              min-height: 54px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 12px;
              margin-top: auto;
              padding: 0 18px;
              border-radius: 13px;
              color: #fff;
              background: var(--blue);
              font-size: 13px;
              font-weight: 800;
              transition: background .18s ease, transform .18s ease;
          }

          .wiki-video-watch:hover {
              background: #2468ff;
              transform: translateY(-1px);
          }
          CSS

      - name: Append wiki video responsive styles
        shell: bash
        run: |
          cat <<'CSS' >> front/static/front/css/mobile.css

          /* Wiki video library responsive */
          @media (max-width: 1320px) {
              .wiki-video-grid {
                  grid-template-columns: repeat(3, minmax(0, 1fr));
              }
          }

          @media (max-width: 980px) {
              .wiki-video-grid {
                  grid-template-columns: repeat(2, minmax(0, 1fr));
              }
          }

          @media (max-width: 640px) {
              .wiki-videos-section {
                  padding: 24px 0 8px;
              }

              .wiki-videos-heading h2 {
                  font-size: 36px;
              }

              .wiki-videos-lead {
                  font-size: 13px;
              }

              .wiki-video-filters {
                  flex-wrap: nowrap;
                  gap: 8px;
                  margin-top: 22px;
                  padding-bottom: 2px;
                  overflow-x: auto;
                  scrollbar-width: none;
                  -webkit-overflow-scrolling: touch;
              }

              .wiki-video-filters::-webkit-scrollbar {
                  display: none;
              }

              .wiki-video-filter {
                  min-height: 46px;
                  flex: 0 0 auto;
                  padding: 0 16px;
                  border-radius: 13px;
                  font-size: 12px;
              }

              .wiki-video-filter-icon {
                  width: 18px;
                  height: 18px;
                  flex-basis: 18px;
              }

              .wiki-video-grid {
                  grid-template-columns: 1fr;
                  gap: 14px;
                  margin-top: 22px;
              }

              .wiki-video-card {
                  border-radius: 15px;
              }

              .wiki-video-preview {
                  aspect-ratio: 1.28 / 1;
              }

              .wiki-video-play {
                  width: 58px;
                  height: 58px;
              }

              .wiki-video-copy {
                  min-height: 224px;
                  padding: 16px;
              }

              .wiki-video-copy h3 {
                  font-size: 18px;
              }

              .wiki-video-watch {
                  min-height: 50px;
              }
          }
          CSS

      - name: Commit styles and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wiki-video-css-patch.yml
          git add front/static/front/css/main.css front/static/front/css/mobile.css
          git commit -m "Style wiki video library"
          git push origin HEAD:main
