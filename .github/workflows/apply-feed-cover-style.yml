name: Apply feed cover styles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-feed-cover-style.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update feed prediction cover styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("front/static/front/css/main.css")
          css = path.read_text()

          old = '''.feed-prediction-cover-fallback {
    /* background:
        radial-gradient(circle at 18% 48%, rgba(255, 54, 75, .28), transparent 42%),
        radial-gradient(circle at 84% 44%, rgba(44, 107, 255, .30), transparent 45%),
        linear-gradient(135deg, #28171b 0%, #141923 48%, #10203d 100%); */'''
          new = '''.feed-prediction-cover-fallback {
    background: radial-gradient(circle at 18% 48%, rgba(255, 54, 75, .28), transparent 42%), radial-gradient(circle at 84% 44%, rgba(44, 107, 255, .30), transparent 45%), linear-gradient(135deg, #28171b 0%, #141923 48%, #10203d 100%);'''

          if old not in css:
              raise SystemExit("feed-prediction-cover-fallback block not found")
          css = css.replace(old, new, 1)

          styles = r'''

.feed-prediction-cover-status,
.feed-prediction-cover-confidence {
    position: absolute;
    top: 18px;
    z-index: 4;
}

.feed-prediction-cover-status {
    left: 18px;
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-radius: 999px;
    color: var(--yellow);
    background: var(--ink);
    font-size: 13px;
    line-height: 1;
}

.feed-prediction-cover-status svg {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.feed-prediction-cover-status strong {
    color: inherit;
    font-weight: 700;
}

.feed-prediction-cover-status.is-win {
    color: #fff;
    background: var(--green);
}

.feed-prediction-cover-status.is-lose {
    color: #fff;
    background: var(--danger);
}

.feed-prediction-cover-status.is-refund {
    color: #fff;
    background: var(--blue);
}

.feed-prediction-cover-confidence {
    right: 18px;
    width: 78px;
    aspect-ratio: 1;
    display: grid;
    place-content: center;
    gap: 3px;
    border-radius: 50%;
    color: #fff;
    background: var(--blue);
    text-align: center;
}

.feed-prediction-cover-confidence strong {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
}

.feed-prediction-cover-confidence span {
    font-size: 9px;
    line-height: 1.1;
}

@media (max-width: 760px) {
    .feed-prediction-cover-status,
    .feed-prediction-cover-confidence {
        top: 12px;
    }

    .feed-prediction-cover-status {
        left: 12px;
        min-height: 34px;
        padding: 0 10px;
        font-size: 11px;
    }

    .feed-prediction-cover-status svg {
        width: 16px;
        height: 16px;
        flex-basis: 16px;
    }

    .feed-prediction-cover-confidence {
        right: 12px;
        width: 64px;
    }

    .feed-prediction-cover-confidence strong {
        font-size: 17px;
    }

    .feed-prediction-cover-confidence span {
        font-size: 8px;
    }
}
'''

          if ".feed-prediction-cover-status," not in css:
              css = css.rstrip() + styles + "\n"

          path.write_text(css)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/static/front/css/main.css
          git commit -m "Style feed prediction cover status and confidence"
          git push origin HEAD:main
