name: Implement legacy balance migration cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wallet-step5-implement.yml

permissions:
  contents: write

jobs:
  migrate-and-clean:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cappers
          POSTGRES_USER: cappers
          POSTGRES_PASSWORD: cappers_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cappers -d cappers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: test-wallet-step5
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: cappers
      POSTGRES_USER: cappers
      POSTGRES_PASSWORD: cappers_dev_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CACHE_URL: redis://127.0.0.1:6379/2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch runtime and add migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # Runtime models: CoinWallet becomes the only virtual/game-currency source of truth.
          models_path = Path("wallets/models.py")
          models = models_path.read_text()
          start = models.index("\nclass CapperBalance(models.Model):")
          end = models.index("\nclass CapperRealBalance(models.Model):", start)
          models = models[:start] + "\n\n" + models[end:]
          legacy_real_kind = '        VIRTUAL_TOP_UP = "virtual_top_up", "Пополнение виртуального баланса"\n'
          if legacy_real_kind not in models:
              raise SystemExit("Legacy real->virtual transaction kind not found")
          models = models.replace(legacy_real_kind, "", 1)
          models_path.write_text(models)

          replace_once(
              "wallets/context_processors.py",
              "def capper_balance(request) -> dict:\n",
              "def coin_wallet(request) -> dict:\n",
          )

          settings_path = Path("cappers/settings.py")
          settings = settings_path.read_text()
          settings = settings.replace("from decimal import Decimal\n", "", 1)
          settings = settings.replace(
              '                "wallets.context_processors.capper_balance",\n',
              '                "wallets.context_processors.coin_wallet",\n',
              1,
          )
          for line in (
              'CAPPER_STARTING_BALANCE = Decimal(os.getenv("CAPPER_STARTING_BALANCE", "10000.00"))\n',
              'CAPPER_VIRTUAL_TOP_UP_AMOUNT = Decimal(os.getenv("CAPPER_VIRTUAL_TOP_UP_AMOUNT", "10000.00"))\n',
          ):
              if line not in settings:
                  raise SystemExit(f"Legacy setting not found: {line.strip()}")
              settings = settings.replace(line, "", 1)
          settings_path.write_text(settings)

          env_path = Path(".env.example")
          env = env_path.read_text()
          for line in (
              "CAPPER_STARTING_BALANCE=10000.00\n",
              "CAPPER_VIRTUAL_TOP_UP_AMOUNT=10000.00\n",
          ):
              if line not in env:
                  raise SystemExit(f"Legacy env setting not found: {line.strip()}")
              env = env.replace(line, "", 1)
          env_path.write_text(env)

          replace_once(
              "tournaments/tests.py",
              "        self.analyst.capper_balance.refresh_from_db()\n        self.assertEqual(self.analyst.capper_balance.balance, Decimal(\"9900.00\"))\n",
              "        self.analyst.coin_wallet.refresh_from_db()\n        self.assertEqual(self.analyst.coin_wallet.balance, 900)\n",
          )

          # Remove a stale runtime issue note that describes the deleted legacy service.
          errors_path = Path("Errors to fix.md")
          errors = errors_path.read_text()
          errors = errors.replace(
              "13. _ensure_initial_bonus_locked в services.py — создаёт транзакцию INITIAL_BONUS даже при CAPPER_STARTING_BALANCE=0.\n",
              "",
          )
          errors_path.write_text(errors)

          migration_0008 = '''from decimal import Decimal, ROUND_HALF_UP

from django.db import migrations


COIN_UNIT = Decimal("1")
INITIAL_GRANT_KIND = "initial_grant"


def _to_coins(value):
    """Step 5 conversion rule: 1 legacy virtual-balance unit = 1 coin."""
    return int(Decimal(value).quantize(COIN_UNIT, rounding=ROUND_HALF_UP))


def migrate_virtual_balance_to_coins(apps, schema_editor):
    CapperBalance = apps.get_model("wallets", "CapperBalance")
    BalanceTransaction = apps.get_model("wallets", "BalanceTransaction")
    CoinWallet = apps.get_model("wallets", "CoinWallet")
    CoinTransaction = apps.get_model("wallets", "CoinTransaction")

    # Wallet balances are authoritative during the cutover. Existing CoinWallet rows
    # are updated rather than duplicated so the migration is safe if 0007 was already
    # applied before this deploy.
    for legacy_wallet in CapperBalance.objects.order_by("user_id").iterator():
        coin_balance = _to_coins(legacy_wallet.balance)
        if coin_balance < 0:
            raise RuntimeError(
                f"Cannot migrate negative virtual balance for user {legacy_wallet.user_id}: "
                f"{legacy_wallet.balance}"
            )

        coin_wallet, _ = CoinWallet.objects.update_or_create(
            user_id=legacy_wallet.user_id,
            defaults={"balance": coin_balance},
        )
        CoinWallet.objects.filter(pk=coin_wallet.pk).update(
            created_at=legacy_wallet.created_at,
            updated_at=legacy_wallet.updated_at,
        )

        # Prevent ensure_coin_wallet() from granting starting coins on top of the
        # already-migrated legacy balance. This is a migration marker, not a fallback.
        marker, marker_created = CoinTransaction.objects.get_or_create(
            user_id=legacy_wallet.user_id,
            kind=INITIAL_GRANT_KIND,
            defaults={
                "amount": 0,
                "balance_after": coin_balance,
                "related_model": "",
                "related_id": None,
                "note": "Миграция: стартовые коины уже учтены в перенесенном балансе",
            },
        )
        if marker_created:
            CoinTransaction.objects.filter(pk=marker.pk).update(
                created_at=legacy_wallet.created_at,
            )

    # Preserve the legacy ledger exactly at the semantic level: kind, relation and
    # note stay unchanged; Decimal amounts use ROUND_HALF_UP to become integer coins.
    for legacy_tx in BalanceTransaction.objects.order_by("id").iterator():
        amount = _to_coins(legacy_tx.amount)
        balance_after = _to_coins(legacy_tx.balance_after)
        if balance_after < 0:
            raise RuntimeError(
                f"Cannot migrate negative balance_after in legacy transaction {legacy_tx.pk}: "
                f"{legacy_tx.balance_after}"
            )

        defaults = {
            "amount": amount,
            "balance_after": balance_after,
            "note": legacy_tx.note,
        }
        if legacy_tx.related_id is not None:
            coin_tx, _ = CoinTransaction.objects.update_or_create(
                user_id=legacy_tx.user_id,
                kind=legacy_tx.kind,
                related_model=legacy_tx.related_model,
                related_id=legacy_tx.related_id,
                defaults=defaults,
            )
        else:
            coin_tx = CoinTransaction.objects.create(
                user_id=legacy_tx.user_id,
                kind=legacy_tx.kind,
                amount=amount,
                balance_after=balance_after,
                related_model=legacy_tx.related_model,
                related_id=None,
                note=legacy_tx.note,
            )
        CoinTransaction.objects.filter(pk=coin_tx.pk).update(
            created_at=legacy_tx.created_at,
        )


class Migration(migrations.Migration):
    dependencies = [
        ("wallets", "0007_coin_wallets"),
    ]

    operations = [
        migrations.RunPython(
            migrate_virtual_balance_to_coins,
            migrations.RunPython.noop,
        ),
    ]
'''
          Path("wallets/migrations/0008_migrate_virtual_balance_to_coins.py").write_text(migration_0008)

          migration_0009 = '''from django.db import migrations, models


class Migration(migrations.Migration):
    dependencies = [
        ("wallets", "0008_migrate_virtual_balance_to_coins"),
    ]

    operations = [
        migrations.DeleteModel(
            name="BalanceTransaction",
        ),
        migrations.DeleteModel(
            name="CapperBalance",
        ),
        migrations.AlterField(
            model_name="realbalancetransaction",
            name="kind",
            field=models.CharField(
                choices=[
                    ("subscription_income", "Доход с подписки"),
                    ("tournament_prize", "Приз турнира"),
                    ("referral_subscription", "Реферал: покупка подписки"),
                    ("referral_tournament", "Реферал: приз турнира"),
                    ("referral_balance_top_up", "Реферал: пополнение баланса"),
                    ("real_deposit", "Реальное пополнение"),
                    ("withdrawal_request", "Заявка на вывод"),
                    ("withdrawal_cancel", "Отмена вывода"),
                    ("adjustment", "Корректировка"),
                ],
                db_index=True,
                max_length=32,
                verbose_name="Тип",
            ),
        ),
    ]
'''
          Path("wallets/migrations/0009_remove_legacy_virtual_balance.py").write_text(migration_0009)
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate migration state
        run: |
          python -m compileall -q wallets cappers tournaments cabinet game front
          python manage.py check
          python manage.py makemigrations --check --dry-run wallets

      - name: Seed legacy data at migration 0007
        run: |
          python manage.py migrate wallets 0007 --noinput
          python manage.py shell <<'PY'
          from datetime import datetime, timezone
          from decimal import Decimal
          from django.db import connection
          from django.db.migrations.executor import MigrationExecutor

          executor = MigrationExecutor(connection)
          state = executor.loader.project_state([("wallets", "0007_coin_wallets")])
          apps = state.apps

          User = apps.get_model("cabinet", "User")
          CapperBalance = apps.get_model("wallets", "CapperBalance")
          BalanceTransaction = apps.get_model("wallets", "BalanceTransaction")
          CapperRealBalance = apps.get_model("wallets", "CapperRealBalance")
          RealBalanceTransaction = apps.get_model("wallets", "RealBalanceTransaction")

          user = User.objects.create(
              username="legacy-migration-user",
              password="!",
              role="reader",
          )
          stamp = datetime(2025, 1, 2, 3, 4, 5, tzinfo=timezone.utc)

          legacy_wallet = CapperBalance.objects.create(
              user_id=user.pk,
              balance=Decimal("989.50"),
          )
          CapperBalance.objects.filter(pk=legacy_wallet.pk).update(
              created_at=stamp,
              updated_at=stamp,
          )

          initial_tx = BalanceTransaction.objects.create(
              user_id=user.pk,
              kind="initial_bonus",
              amount=Decimal("1000.00"),
              balance_after=Decimal("1000.00"),
              note="legacy initial",
          )
          BalanceTransaction.objects.filter(pk=initial_tx.pk).update(created_at=stamp)

          stake_tx = BalanceTransaction.objects.create(
              user_id=user.pk,
              kind="prediction_stake",
              amount=Decimal("-10.50"),
              balance_after=Decimal("989.50"),
              related_model="game.predictioncoupon",
              related_id=4242,
              note="legacy stake",
          )
          BalanceTransaction.objects.filter(pk=stake_tx.pk).update(created_at=stamp)

          real_wallet = CapperRealBalance.objects.create(
              user_id=user.pk,
              balance=Decimal("77.77"),
              pending_withdrawal=Decimal("0.00"),
          )
          real_tx = RealBalanceTransaction.objects.create(
              user_id=user.pk,
              kind="adjustment",
              status="completed",
              amount=Decimal("10.00"),
              balance_after=Decimal("77.77"),
              note="real balance must survive",
          )
          print("legacy fixture seeded", user.pk, real_wallet.pk, real_tx.pk)
          PY

      - name: Apply full migrations and verify data cutover
        run: |
          python manage.py migrate --noinput
          python manage.py shell <<'PY'
          from datetime import datetime, timezone
          from decimal import Decimal
          from cabinet.models import User
          from wallets import models as wallet_models
          from wallets.models import CoinTransaction, CoinWallet, CapperRealBalance, RealBalanceTransaction

          assert not hasattr(wallet_models, "CapperBalance")
          assert not hasattr(wallet_models, "BalanceTransaction")

          user = User.objects.get(username="legacy-migration-user")
          wallet = CoinWallet.objects.get(user=user)
          assert wallet.balance == 990, wallet.balance

          initial = CoinTransaction.objects.get(
              user=user,
              kind="initial_bonus",
              note="legacy initial",
          )
          assert initial.amount == 1000
          assert initial.balance_after == 1000

          stake = CoinTransaction.objects.get(
              user=user,
              kind="prediction_stake",
              related_model="game.predictioncoupon",
              related_id=4242,
          )
          assert stake.amount == -11, stake.amount
          assert stake.balance_after == 990, stake.balance_after
          assert stake.note == "legacy stake"
          assert stake.created_at == datetime(2025, 1, 2, 3, 4, 5, tzinfo=timezone.utc)

          marker = CoinTransaction.objects.get(user=user, kind="initial_grant")
          assert marker.amount == 0
          assert marker.balance_after == 990

          real_wallet = CapperRealBalance.objects.get(user=user)
          assert real_wallet.balance == Decimal("77.77")
          real_tx = RealBalanceTransaction.objects.get(user=user, note="real balance must survive")
          assert real_tx.balance_after == Decimal("77.77")

          new_user = User.objects.create_user(
              username="post-migration-user",
              password="safe-test-password",
              role=User.Role.READER,
          )
          new_user.coin_wallet.refresh_from_db()
          assert new_user.coin_wallet.balance == 1000
          assert CoinTransaction.objects.filter(
              user=new_user,
              kind=CoinTransaction.Kind.INITIAL_GRANT,
              amount=1000,
          ).count() == 1

          print("CoinWallet count:", CoinWallet.objects.count())
          print("CoinTransaction count:", CoinTransaction.objects.count())
          print("legacy->coin migration verified")
          PY

      - name: Run focused tests
        run: |
          python manage.py test wallets.test_coins wallets.tests.CoinWalletIntegrationTests
          python manage.py test tournaments.tests.TournamentServiceTests.test_create_tournament_coupon_creates_public_coupon_and_tournament_links

      - name: Assert no legacy runtime references
        run: |
          if grep -RInE '\bCapperBalance\b|\bBalanceTransaction\b|capper_balance|virtual_balance|CAPPER_STARTING_BALANCE|CAPPER_VIRTUAL_TOP_UP_AMOUNT|virtual_top_up|VIRTUAL_TOP_UP|VIRTUAL_DEPOSIT|REAL_TO_VIRTUAL|Виртуальн' \
            wallets cappers cabinet game tournaments templates front \
            --exclude-dir=migrations \
            --exclude='test*.py'; then
            echo 'Legacy virtual balance reference remains in runtime code.'
            exit 1
          fi

      - name: Commit implementation and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/wallet-step5-audit.yml
          rm -f .github/workflows/wallet-step5-implement.yml
          git add -A
          git commit -m "wallets: migrate legacy virtual balance to coins"
          git push origin main
