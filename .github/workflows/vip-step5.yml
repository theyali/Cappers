name: Verify and clean VIP banner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vip-step5.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup and static audit
        run: python .github/vip_step5_apply.py
      - name: Compile touched Python modules
        run: python -m compileall -q front/vip_cappers.py back/templatetags/site_extras.py
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Verify and clean VIP cappers banner"
          git push
