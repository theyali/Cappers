name: Add configurable bookmaker placements

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-bookmaker-placements.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        run: python .github/scripts/apply_bookmaker_placements_v2.py

      - name: Remove one-shot files
        run: rm -f .github/workflows/add-bookmaker-placements.yml .github/scripts/apply_bookmaker_placements.py .github/scripts/apply_bookmaker_placements_v2.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add configurable bookmaker placements"
          git push origin main
