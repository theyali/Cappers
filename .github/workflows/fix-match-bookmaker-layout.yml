name: Fix match bookmaker layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-match-bookmaker-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout changes
        run: python .github/scripts/fix_match_bookmaker_layout.py

      - name: Remove one-shot files
        run: rm -f .github/workflows/fix-match-bookmaker-layout.yml .github/scripts/fix_match_bookmaker_layout.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align bookmaker logos in match layouts"
          git push origin main
