name: Apply wiki dictionary styles

'on':
  push:
    paths:
      - '.github/workflows/wiki-term-dictionary-css.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply styles
        run: python .github/scripts/apply_wiki_dictionary_styles.py
      - name: Commit styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Style wiki dictionary reference layout"
          git push
