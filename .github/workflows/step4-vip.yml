name: Apply VIP banner page integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step4-vip.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply step 4
        run: python .github/step4_vip_apply.py
      - name: Commit step 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Integrate VIP banner on target pages"
          git push
