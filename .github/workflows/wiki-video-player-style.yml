name: Apply wiki video player styles

on:
  push:
    paths:
      - '.github/workflows/wiki-video-player-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append player styles
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          main = Path('front/static/front/css/main.css')
          mobile = Path('front/static/front/css/mobile.css')

          main_marker = '/* Wiki inline video player */'
          main_css = dedent('''
              
              /* Wiki inline video player */
              .wiki-video-card {
                  cursor: pointer;
              }

              .wiki-video-player {
                  position: fixed;
                  inset: 0;
                  z-index: 2100;
                  display: none;
                  place-items: center;
                  padding: 24px;
                  background: var(--ink);
              }

              .wiki-video-player.is-open {
                  display: grid;
              }

              .wiki-video-player[hidden] {
                  display: none !important;
              }

              body.wiki-video-player-open {
                  overflow: hidden;
              }

              .wiki-video-player-shell {
                  width: min(1180px, 100%);
                  display: grid;
                  gap: 12px;
                  padding: 14px;
                  border-radius: 20px;
                  background: var(--panel);
              }

              .wiki-video-player-head {
                  min-height: 48px;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 18px;
                  padding: 0 4px 0 8px;
              }

              .wiki-video-player-head strong {
                  min-width: 0;
                  overflow: hidden;
                  color: var(--text);
                  font-size: 16px;
                  text-overflow: ellipsis;
                  white-space: nowrap;
              }

              .wiki-video-player-close {
                  width: 42px;
                  height: 42px;
                  flex: 0 0 auto;
                  display: grid;
                  place-items: center;
                  padding: 0;
                  border: 0;
                  border-radius: 12px;
                  color: #fff;
                  background: #303033;
                  cursor: pointer;
                  font-size: 28px;
                  line-height: 1;
              }

              .wiki-video-player-close:hover {
                  background: var(--blue);
              }

              .wiki-video-player-media {
                  width: 100%;
                  aspect-ratio: 16 / 9;
                  overflow: hidden;
                  border-radius: 16px;
                  background: #080808;
              }

              .wiki-video-player-media video {
                  width: 100%;
                  height: 100%;
                  display: block;
                  object-fit: contain;
                  background: #080808;
              }
          ''')

          text = main.read_text()
          if main_marker not in text:
              main.write_text(text.rstrip() + main_css + '\n')

          mobile_marker = '/* Wiki inline video player responsive */'
          mobile_css = dedent('''
              
              /* Wiki inline video player responsive */
              @media (max-width: 760px) {
                  .wiki-video-player {
                      padding: 0;
                  }

                  .wiki-video-player-shell {
                      width: 100%;
                      min-height: 100dvh;
                      align-content: center;
                      padding: 12px;
                      border-radius: 0;
                      background: var(--ink);
                  }

                  .wiki-video-player-head {
                      padding: 0;
                  }

                  .wiki-video-player-head strong {
                      font-size: 14px;
                  }

                  .wiki-video-player-media {
                      border-radius: 12px;
                  }
              }
          ''')

          text = mobile.read_text()
          if mobile_marker not in text:
              mobile.write_text(text.rstrip() + mobile_css + '\n')

          Path('.github/workflows/wiki-video-player-style.yml').unlink()
          PY
      - name: Commit styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/static/front/css/main.css front/static/front/css/mobile.css .github/workflows/wiki-video-player-style.yml
          git commit -m "Style inline wiki video player"
          git push
