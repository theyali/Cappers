name: Apply profile hero background

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step6-bundle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply profile hero background and restore workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("front/static/front/css/main.css")
          text = path.read_text(encoding="utf-8")
          old = '''.profile-page .profile-hero {
              position: relative;
              min-width: 0;
              min-height: 302px;
              display: grid;
              grid-template-columns: minmax(0, 1fr) minmax(280px, 338px);
              align-items: stretch;
              gap: 24px;
              padding: 24px;
              overflow: hidden;
              border-radius: 22px;
              background-color: #171718;
          }'''.replace('          ', '')
          new = '''.profile-page .profile-hero {
              position: relative;
              min-width: 0;
              min-height: 302px;
              display: grid;
              grid-template-columns: minmax(0, 1fr) minmax(280px, 338px);
              align-items: stretch;
              gap: 24px;
              padding: 24px;
              overflow: hidden;
              border-radius: 22px;
              background-color: #171718;
              background-image: url("../img/public_hero/publ_5.png");
              background-position: center;
              background-size: cover;
              background-repeat: no-repeat;
          }'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f"expected one profile hero block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git checkout HEAD^ -- .github/workflows/step6-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/static/front/css/main.css .github/workflows/step6-bundle.yml
          git diff --cached --check
          git commit -m "style: add profile hero background"
          git push origin HEAD:main
