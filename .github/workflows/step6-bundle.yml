name: Export verified step 6 patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step6-bundle.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified patch bundle
        run: |
          python .github/step6_apply.py
          python .github/step6_finalize_patch.py
          git diff --name-only -z | tar --null -T - -czf /tmp/step6-patched.tar.gz
          echo '===STEP6_BUNDLE_BEGIN==='
          base64 -w0 /tmp/step6-patched.tar.gz
          echo
          echo '===STEP6_BUNDLE_END==='
          echo '===STEP6_FILES==='
          git diff --name-only
