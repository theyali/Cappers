name: Inspect become capper hero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step6-bundle.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find existing become-capper implementation
        run: |
          echo "=== ROUTE/TEMPLATE PATTERNS ==="
          rg -n "become.?capper|capper-landing|Стать каппером|Как стать каппером" templates cabinet front pages -g '!*.pyc' || true
          echo "=== ASSET ==="
          find front static templates -iname 'become_capper.jpg' -o -iname '*become*capper*' 2>/dev/null | head -100
