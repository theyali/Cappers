name: Inspect become capper styles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step6-bundle.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture existing styles
        run: |
          {
            echo "=== STYLE REFERENCES ==="
            rg -n "capper-landing-hero|capper-landing-promise|capper-kicker|capper-growth-link|capper-landing-lead|capper-landing-actions" front/static/front/css templates || true
          } > .github/become_capper_scan.txt
      - name: Commit scan output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/become_capper_scan.txt
          git commit -m "Capture become capper style references"
          git push origin HEAD:main
