name: Export verified step 6 patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step6-bundle.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified patch bundle
        run: |
          python .github/step6_apply.py
          python .github/step6_finalize_patch.py
          git diff --name-only -z | tar --null -T - -czf step6-patched.tar.gz
          git diff --name-only
      - uses: actions/upload-artifact@v4
        with:
          name: step6-patched
          path: step6-patched.tar.gz
          if-no-files-found: error
