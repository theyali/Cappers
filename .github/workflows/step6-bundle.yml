name: Apply how-it-works hero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step6-bundle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update how-it-works hero
        run: |
          python - <<'PY'
          from pathlib import Path

          template_path = Path("templates/front/how_it_works.html")
          template = template_path.read_text()
          old_hero = '''    <div class="how-hero">
                  <div class="how-hero-copy">
                      <p class="how-kicker">Как это работает</p>
                      <h1>КапперХаб по шагам</h1>
                      <p>Матчи, прогнозы, запросы на прогноз, уведомления, Telegram и профиль каппера — без лишних действий.</p>
                  </div>
                  <div class="how-hero-mark" aria-hidden="true">
                      <span>?</span>
                  </div>
              </div>'''.replace('              ', '    ')
          new_hero = '''    <div class="how-hero">
                  <div class="how-hero-copy">
                      <p class="how-kicker">Как это работает</p>
                      <h1>КапперХаб по шагам</h1>
                      <p>Матчи, прогнозы, эксперты, турниры и уведомления — всё, что вам нужно, в одном месте. Следуйте простым шагам и начните использовать КапперХаб уже сегодня.</p>
                      <a class="how-action is-blue how-hero-action" href="{% url 'game:match_list' %}">Начать сейчас <span>→</span></a>
                  </div>
              </div>'''.replace('              ', '    ')
          if old_hero not in template:
              raise SystemExit("Expected how-hero markup was not found")
          template_path.write_text(template.replace(old_hero, new_hero, 1))

          css_path = Path("front/static/front/css/main.css")
          css = css_path.read_text()
          old_css = '''.how-hero,
          .how-panel,
          .how-role-tabs {
              background: var(--panel);
          }

          .how-hero,
          .how-panel {
              border-radius: 24px;
          }

          .how-hero {
              min-height: 300px;
              display: grid;
              grid-template-columns: minmax(0, 1fr) 190px;
              align-items: center;
              gap: 30px;
              padding: clamp(28px, 4vw, 52px);
          }

          .how-hero-copy {
              max-width: 820px;
          }

          .how-kicker {
              margin: 0 0 12px;
              color: var(--yellow);
              font-size: 11px;
              font-weight: 700;
              letter-spacing: .12em;
              text-transform: uppercase;
          }

          .how-hero h1 {
              margin: 0;
              max-width: 820px;
              font-size: clamp(40px, 5vw, 72px);
              line-height: .96;
              letter-spacing: -.045em;
          }

          .how-hero-copy > p:last-child {
              max-width: 760px;
              margin: 20px 0 0;
              color: rgba(255, 255, 255, .64);
              font-size: 15px;
              line-height: 1.65;
          }

          .how-hero-mark {
              width: 150px;
              height: 150px;
              justify-self: end;
              display: grid;
              place-items: center;
              border-radius: 34px;
              color: var(--ink);
              background: var(--yellow);
              font-size: 74px;
              line-height: 1;
          }'''.replace('          ', '')
          new_css = '''.how-panel,
          .how-role-tabs {
              background: var(--panel);
          }

          .how-panel {
              border-radius: 24px;
          }

          .how-hero {
              min-height: 390px;
              display: flex;
              align-items: center;
              padding: 56px 54px;
              overflow: hidden;
              background-color: #0d0f12;
              background-image: url("../img/how_it_works.png");
              background-repeat: no-repeat;
              background-position: center;
              background-size: cover;
          }

          .how-hero-copy {
              width: min(100%, 650px);
          }

          .how-kicker {
              margin: 0 0 16px;
              color: var(--yellow);
              font-size: 12px;
              font-weight: 600;
              letter-spacing: .12em;
              text-transform: uppercase;
          }

          .how-hero h1 {
              max-width: 650px;
              margin: 0;
              color: #fff;
              font-size: clamp(46px, 4.2vw, 66px);
              font-weight: 600;
              line-height: 1;
              letter-spacing: -.035em;
          }

          .how-hero-copy > p:last-of-type {
              max-width: 620px;
              margin: 22px 0 0;
              color: rgba(255, 255, 255, .68);
              font-size: 16px;
              line-height: 1.6;
          }

          .how-hero .how-hero-action {
              width: 260px;
              min-height: 56px;
              margin-top: 28px;
              padding: 0 24px;
              border-radius: 12px;
              font-size: 16px;
              font-weight: 500;
          }'''.replace('          ', '')
          if old_css not in css:
              raise SystemExit("Expected how-hero CSS was not found")
          css = css.replace(old_css, new_css, 1)

          old_1100 = '''@media (max-width: 1100px) {
              .how-hero {
                  grid-template-columns: 1fr;
              }

              .how-hero-mark {
                  display: none;
              }

              .how-intro {'''.replace('          ', '')
          new_1100 = '''@media (max-width: 1100px) {
              .how-hero {
                  min-height: 360px;
                  padding: 44px 32px;
                  background-position: 62% center;
              }

              .how-hero-copy {
                  width: min(100%, 570px);
              }

              .how-intro {'''.replace('          ', '')
          if old_1100 not in css:
              raise SystemExit("Expected how-hero 1100px rules were not found")
          css = css.replace(old_1100, new_1100, 1)

          old_760 = '''@media (max-width: 760px) {
              .how-hero,
              .how-panel {
                  border-radius: 18px;
              }

              .how-hero {
                  min-height: 0;
                  padding: 24px 18px;
              }

              .how-hero h1 {
                  font-size: clamp(36px, 12vw, 52px);
              }

              .how-role-tabs {'''.replace('          ', '')
          new_760 = '''@media (max-width: 760px) {
              .how-panel {
                  border-radius: 18px;
              }

              .how-hero {
                  min-height: 420px;
                  align-items: flex-end;
                  padding: 28px 18px;
                  background-position: 68% center;
                  background-size: auto 100%;
              }

              .how-hero-copy {
                  width: 100%;
              }

              .how-hero h1 {
                  font-size: clamp(36px, 12vw, 52px);
              }

              .how-hero-copy > p:last-of-type {
                  max-width: 460px;
                  margin-top: 16px;
                  font-size: 14px;
                  line-height: 1.5;
              }

              .how-hero .how-hero-action {
                  width: min(100%, 280px);
                  min-height: 52px;
                  margin-top: 20px;
                  font-size: 14px;
              }

              .how-role-tabs {'''.replace('          ', '')
          if old_760 not in css:
              raise SystemExit("Expected how-hero 760px rules were not found")
          css_path.write_text(css.replace(old_760, new_760, 1))
          PY
      - name: Commit hero changes and restore workflow
        run: |
          echo '' | base64 -d > .github/workflows/step6-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/front/how_it_works.html front/static/front/css/main.css .github/workflows/step6-bundle.yml
          git commit -m "Match how-it-works hero to reference"
          git push origin HEAD:main
