name: Apply wiki term AJAX polish

on:
  push:
    paths:
      - '.github/workflows/wiki-term-ajax-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wiki term assets
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path('templates/front/wiki.html')
          text = template.read_text()
          old = '''{% block extra_js %}
          <script src="{% static 'front/js/wiki-videos.js' %}" defer></script>
          <script src="{% static 'front/js/wiki-terms.js' %}" defer></script>
          {% endblock %}'''
          new = '''{% block extra_js %}
          <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous" defer></script>
          <script src="{% static 'front/js/wiki-videos.js' %}" defer></script>
          <script src="{% static 'front/js/wiki-terms.js' %}" defer></script>
          {% endblock %}'''
          if old not in text:
              raise SystemExit('wiki extra_js block not found')
          template.write_text(text.replace(old, new, 1))

          main = Path('front/static/front/css/main.css')
          marker = '/* Wiki dictionary AJAX fixes */'
          css = '''

          /* Wiki dictionary AJAX fixes */
          .wiki-dictionary-content {
              min-width: 0;
              min-height: 320px;
          }

          .wiki-term-card {
              overflow: hidden;
          }

          .wiki-term-card-copy,
          .wiki-term-card-head,
          .wiki-term-card-copy > p,
          .wiki-term-card-head h3 {
              min-width: 0;
              max-width: 100%;
          }

          .wiki-term-card-copy > p,
          .wiki-term-card-head h3 {
              overflow-wrap: anywhere;
              word-break: break-word;
          }

          .wiki-dictionary-filter,
          .wiki-dictionary-more {
              border: 0;
              font: inherit;
              cursor: pointer;
          }

          .wiki-dictionary-filter {
              text-align: left;
          }

          .wiki-dictionary-more {
              width: 100%;
          }
          '''
          main_text = main.read_text()
          if marker not in main_text:
              main.write_text(main_text.rstrip() + css + '\n')

          Path('.github/workflows/wiki-term-ajax-polish.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish AJAX wiki term filtering"
          git push
