name: Apply VIP cappers banner styles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vip-banner-style.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped VIP banner styles
        run: python .github/vip_banner_style_apply.py
      - name: Remove one-shot helper files
        run: rm .github/vip_banner_style_apply.py .github/workflows/vip-banner-style.yml
      - name: Commit VIP banner styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/static/front/css/main.css front/static/front/css/mobile.css .github/vip_banner_style_apply.py .github/workflows/vip-banner-style.yml
          git diff --cached --exit-code && exit 0
          git commit -m "Style VIP cappers banner"
          git push
