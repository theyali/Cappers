name: Fix home match bookmaker context

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-home-match-bookmaker-context.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply context fix
        run: python .github/scripts/fix_home_match_bookmaker_context.py

      - name: Remove one-shot files
        run: rm -f .github/workflows/fix-home-match-bookmaker-context.yml .github/scripts/fix_home_match_bookmaker_context.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: pass bookmaker settings to home match cards"
          git push origin main
