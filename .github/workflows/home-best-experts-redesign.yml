          }

          .home-best-expert-row-avatar img {
              width: 100%;
              height: 100%;
              display: block;
              object-fit: cover;
          }

          .home-best-expert-row-copy {
              min-width: 0;
              display: flex;
              flex-direction: column;
              gap: 4px;
          }

          .home-best-expert-row-name {
              min-width: 0;
              display: flex;
              align-items: center;
              gap: 6px;
          }

          .home-best-expert-row-name strong {
              min-width: 0;
              overflow: hidden;
              color: var(--text);
              font-size: 14px;
              white-space: nowrap;
              text-overflow: ellipsis;
          }

          .home-best-expert-row-copy > span:last-child {
              overflow: hidden;
              color: var(--muted);
              font-size: 11px;
              white-space: nowrap;
              text-overflow: ellipsis;
          }

          .home-best-expert-row-performance {
              min-width: 0;
              display: grid;
              justify-items: start;
              gap: 7px;
          }

          .home-best-expert-row-achievements {
              justify-content: flex-start;
              gap: 5px;
          }

          .home-best-expert-row-stat {
              min-width: 0;
              display: grid;
              gap: 4px;
          }

          .home-best-expert-row-stat strong {
              color: var(--text);
              font-size: 17px;
          }

          .home-best-expert-row-follow {
              width: 100%;
              min-height: 42px;
              white-space: nowrap;
          }

          .home-best-experts-proof {
              min-width: 0;
              display: grid;
              grid-template-columns: minmax(280px, 1.5fr) repeat(3, minmax(170px, .65fr));
              align-items: center;
              gap: 0;
              padding-top: 22px;
              box-shadow: inset 0 1px rgba(255, 255, 255, .08);
          }

          .home-best-experts-proof-lead,
          .home-best-experts-proof-item {
              min-width: 0;
              min-height: 66px;
              display: flex;
              align-items: center;
              gap: 14px;
              padding: 0 22px;
          }

          .home-best-experts-proof-lead {
              padding-left: 8px;
          }

          .home-best-experts-proof-lead svg,
          .home-best-experts-proof-item svg {
              width: 29px;
              height: 29px;
              flex: 0 0 29px;
              fill: #a6a6ad;
          }

          .home-best-experts-proof-lead svg {
              fill: var(--yellow);
          }

          .home-best-experts-proof-lead > span,
          .home-best-experts-proof-item > span {
              min-width: 0;
              display: grid;
              gap: 4px;
          }

          .home-best-experts-proof strong {
              color: var(--text);
              font-size: 15px;
          }

          .home-best-experts-proof small {
              color: var(--muted);
              font-size: 11px;
          }

          .home-best-experts-proof-item + .home-best-experts-proof-item {
              box-shadow: inset 1px 0 rgba(255, 255, 255, .08);
          }

          .home-best-experts-empty {
              min-height: 220px;
              display: grid;
              place-items: center;
              align-content: center;
              gap: 8px;
              padding: 24px;
              border-radius: 18px;
              background: var(--panel);
              text-align: center;
          }

          .home-best-experts-empty p {
              margin: 0;
              color: var(--muted);
          }
          '''

          mobile_css = r'''
          /* Home best experts responsive */
          @media (max-width: 1180px) {
              .home-best-experts-stage {
                  grid-template-columns: 1fr;
                  gap: 26px;
              }

              .home-best-experts-runners {
                  grid-template-columns: repeat(2, minmax(0, 1fr));
              }

              .home-best-expert-row {
                  grid-template-columns: 34px minmax(150px, 1fr) minmax(130px, .8fr) 64px 72px;
              }

              .home-best-expert-row-follow {
                  grid-column: 2 / -1;
              }

              .home-best-experts-proof {
                  grid-template-columns: repeat(3, minmax(0, 1fr));
              }

              .home-best-experts-proof-lead {
                  grid-column: 1 / -1;
                  padding: 0 8px 10px;
              }
          }

          @media (max-width: 760px) {
              .home-best-experts {
                  gap: 18px;
                  margin-top: 18px;
              }

              .home-best-experts-head {
                  align-items: stretch;
                  flex-direction: column;
                  gap: 14px;
              }

              .home-best-experts-head h2 {
                  font-size: 30px;
              }

              .home-best-experts-all {
                  width: 100%;
              }

              .home-best-experts-podium {
                  grid-template-columns: 1fr;
                  gap: 22px;
              }

              .home-best-expert-podium-card.is-rank-1,
              .home-best-expert-podium-card.is-rank-2,
              .home-best-expert-podium-card.is-rank-3 {
                  order: initial;
              }

              .home-best-expert-podium-card.is-rank-1 { order: 1; }
              .home-best-expert-podium-card.is-rank-2 { order: 2; }
              .home-best-expert-podium-card.is-rank-3 { order: 3; }

              .home-best-expert-podium-card.is-rank-1 .home-best-expert-podium-link,
              .home-best-expert-podium-card.is-rank-2 .home-best-expert-podium-link,
              .home-best-expert-podium-card.is-rank-3 .home-best-expert-podium-link {
                  min-height: 400px;
              }

              .home-best-expert-pedestal,
              .is-rank-1 .home-best-expert-pedestal,
              .is-rank-2 .home-best-expert-pedestal,
              .is-rank-3 .home-best-expert-pedestal {
                  height: 64px;
              }

              .home-best-experts-runners {
                  grid-template-columns: 1fr;
              }

              .home-best-expert-row {
                  grid-template-columns: 36px 56px minmax(0, 1fr) auto;
                  gap: 9px;
                  padding: 11px;
              }

              .home-best-expert-row-profile {
                  display: contents;
              }

              .home-best-expert-row-avatar {
                  width: 52px;
                  height: 52px;
                  flex-basis: 52px;
              }

              .home-best-expert-row-copy {
                  grid-column: 3;
              }

              .home-best-expert-row-performance {
                  grid-column: 4;
                  justify-items: end;
              }

              .home-best-expert-row-achievements,
              .home-best-expert-row-stat {
                  display: none;
              }

              .home-best-expert-row-follow {
                  grid-column: 2 / -1;
                  width: 100%;
              }

              .home-best-expert-row .home-best-expert-roi {
                  min-height: 28px;
                  padding: 0 9px;
                  font-size: 10px;
              }

              .home-best-experts-proof {
                  grid-template-columns: 1fr;
                  padding-top: 14px;
              }

              .home-best-experts-proof-lead,
              .home-best-experts-proof-item {
                  min-height: 58px;
                  padding: 0 8px;
              }

              .home-best-experts-proof-item + .home-best-experts-proof-item {
                  box-shadow: inset 0 1px rgba(255, 255, 255, .08);
              }
          }
          '''

          template = template_path.read_text()
          block_pattern = re.compile(r'<section class="home-best-experts" aria-labelledby="home-best-experts-title">.*?</section>', re.S)
          template, count = block_pattern.subn(new_block, template, count=1)
          if count != 1:
              raise SystemExit(f'Expected one home-best-experts section, found {count}')
          template_path.write_text(template)
          follow_path.write_text(follow_include)

          css = main_css_path.read_text()
          legacy_pattern = re.compile(r'/\* Legacy source: front/static/front/css/home-experts\.css \*/.*?(?=\n/\* Legacy source:|\Z)', re.S)
          matches = list(legacy_pattern.finditer(css))
          if not matches:
              raise SystemExit('home-experts.css legacy block not found')
          first_start = matches[0].start()
          chunks = []
          cursor = 0
          for match in matches:
              chunks.append(css[cursor:match.start()])
              cursor = match.end()
          chunks.append(css[cursor:])
          css_without = ''.join(chunks)
          removed_before_first = sum(m.end() - m.start() for m in matches if m.start() < first_start)
          insertion_at = first_start - removed_before_first
          css = css_without[:insertion_at] + main_css.strip() + '\n\n' + css_without[insertion_at:]
          main_css_path.write_text(css)

          mobile = mobile_css_path.read_text()
          mobile = re.sub(r'\n\s*\.home-best-experts-grid\s*\{\s*grid-template-columns:\s*1fr\s+1fr;\s*\}\s*', '\n', mobile)
          mobile = re.sub(r'\n\s*/\* Home best experts responsive \*/.*\Z', '\n', mobile, flags=re.S)
          mobile_css_path.write_text(mobile.rstrip() + '\n' + mobile_css.strip() + '\n')

