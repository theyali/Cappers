name: Redesign homepage best experts

on:
  push:
    paths:
      - '.github/workflows/home-best-experts-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply homepage experts redesign
        shell: python
        run: |
          from pathlib import Path
          import re

          template_path = Path('templates/front/index.html')
          main_css_path = Path('front/static/front/css/main.css')
          mobile_css_path = Path('front/static/front/css/mobile.css')
          follow_path = Path('templates/front/includes/_home_expert_follow_action.html')

          new_block = r'''<section class="home-best-experts" aria-labelledby="home-best-experts-title">
              <header class="home-best-experts-head">
                  <div>
                      <p class="home-eyebrow">Рейтинг экспертов</p>
                      <h2 id="home-best-experts-title">Лучшие прогнозисты</h2>
                      <p>Эксперты с лучшими результатами по опубликованным прогнозам и доверию аудитории.</p>
                  </div>
                  <a class="home-best-experts-all" href="{% url 'front:cappers_stats' %}">
                      <span>Все прогнозисты</span>
                      <svg viewBox="0 0 16 16" aria-hidden="true">
                          <path d="M1 8h12M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                  </a>
              </header>

              {% if best_experts %}
              <div class="home-best-experts-stage">
                  <div class="home-best-experts-podium">
                      {% for expert in best_experts|slice:":3" %}
                      <article class="home-best-expert-podium-card is-rank-{{ forloop.counter }}" data-follow-card>
                          <a class="home-best-expert-podium-link" href="{% url 'front:expert_profile' expert.username %}" aria-label="Открыть профиль {{ expert.name }}">
                              <span class="home-best-expert-crown" data-skeleton-image>
                                  {% if forloop.counter == 1 %}
                                  <img src="{% static 'front/img/gold_crown.png' %}" width="72" height="58" alt="" loading="lazy">
                                  {% elif forloop.counter == 2 %}
                                  <img src="{% static 'front/img/silver_crown.png' %}" width="72" height="58" alt="" loading="lazy">
                                  {% else %}
                                  <img src="{% static 'front/img/bronze_crown.png' %}" width="72" height="58" alt="" loading="lazy">
                                  {% endif %}
                              </span>
                              <span class="home-best-expert-rank-badge">#{{ forloop.counter }}</span>

                              <div class="home-best-expert-portrait">
                                  <span class="home-best-expert-laurel is-left" data-skeleton-image>
                                      <img src="{% static 'front/img/clever.png' %}" width="78" height="154" alt="" loading="lazy">
                                  </span>
                                  <span class="home-best-expert-avatar{% if not expert.avatar_url %} is-initials{% endif %}"{% if expert.avatar_url %} data-skeleton-image{% endif %}>
                                      {% if expert.avatar_url %}
                                      <img src="{{ expert.avatar_url }}" width="116" height="116" alt="" loading="lazy">
                                      {% else %}
                                      {{ expert.initials }}
                                      {% endif %}
                                  </span>
                                  <span class="home-best-expert-laurel is-right" data-skeleton-image>
                                      <img src="{% static 'front/img/clever2.png' %}" width="78" height="154" alt="" loading="lazy">
                                  </span>
                                  {% if expert.verified %}
                                  <span class="capper-verified-badge home-best-expert-verified" title="Проверенный эксперт" aria-label="Проверенный эксперт">
                                      <svg viewBox="0 0 16 16" aria-hidden="true">
                                          <path class="capper-verified-bg" d="M10.067.87a2.89 2.89 0 0 0-4.134 0l-.622.638-.89-.011a2.89 2.89 0 0 0-2.924 2.924l.01.89-.636.622a2.89 2.89 0 0 0 0 4.134l.637.622-.011.89a2.89 2.89 0 0 0 2.924 2.924l.89-.01.622.636a2.89 2.89 0 0 0 4.134 0l.622-.637.89.011a2.89 2.89 0 0 0 2.924-2.924l-.01-.89.636-.622a2.89 2.89 0 0 0 0-4.134l-.637-.622.011-.89a2.89 2.89 0 0 0-2.924-2.924l-.89.01z"/>
                                          <path class="capper-verified-check" d="M10.354 6.854a.5.5 0 0 0-.708-.708L7 8.793 5.854 7.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z"/>
                                      </svg>
                                  </span>
                                  {% endif %}
                              </div>

                              <span class="home-best-expert-roi{% if expert.roi < 0 %} is-negative{% endif %}">ROI {% if expert.roi > 0 %}+{% endif %}{{ expert.roi|floatformat:1 }}% · всё время</span>
                              <strong class="home-best-expert-name">{{ expert.name }}</strong>
                              <span class="home-best-expert-username">@{{ expert.username }}</span>

                              {% if expert.latest_achievements %}
                              <span class="home-best-expert-achievements" aria-label="Достижения {{ expert.name }}">
                                  {% for achievement in expert.latest_achievements|slice:":4" %}
                                  <span class="home-best-expert-achievement" title="{{ achievement.label }} — {{ achievement.description }}" data-skeleton-image>
                                      <img src="{% static achievement.icon %}" width="30" height="30" alt="" loading="lazy">
                                  </span>
                                  {% endfor %}
                              </span>
                              {% endif %}

                              <span class="home-best-expert-stats">
                                  <span><small>Публикации</small><strong>{{ expert.publications }}</strong></span>
                                  <span><small>Подписчики</small><strong data-followers-count>{{ expert.followers }}</strong></span>
                              </span>
                          </a>
                          {% include 'front/includes/_home_expert_follow_action.html' with expert=expert action_class='home-best-expert-follow' only %}
                          <div class="home-best-expert-pedestal" aria-hidden="true">
                              <span>{{ forloop.counter }}</span>
                          </div>
                      </article>
                      {% endfor %}
                  </div>

                  <div class="home-best-experts-runners">
                      {% for expert in best_experts|slice:"3:8" %}
                      <article class="home-best-expert-row" data-follow-card>
                          <span class="home-best-expert-row-rank">#{{ forloop.counter|add:"3" }}</span>
                          <a class="home-best-expert-row-profile" href="{% url 'front:expert_profile' expert.username %}">
                              <span class="home-best-expert-row-avatar{% if not expert.avatar_url %} is-initials{% endif %}"{% if expert.avatar_url %} data-skeleton-image{% endif %}>
                                  {% if expert.avatar_url %}
                                  <img src="{{ expert.avatar_url }}" width="66" height="66" alt="" loading="lazy">
                                  {% else %}
                                  {{ expert.initials }}
                                  {% endif %}
                              </span>
                              <span class="home-best-expert-row-copy">
                                  <span class="home-best-expert-row-name">
                                      <strong>{{ expert.name }}</strong>
                                      {% if expert.verified %}
                                      <span class="capper-verified-badge" title="Проверенный эксперт" aria-label="Проверенный эксперт">
                                          <svg viewBox="0 0 16 16" aria-hidden="true">
                                              <path class="capper-verified-bg" d="M10.067.87a2.89 2.89 0 0 0-4.134 0l-.622.638-.89-.011a2.89 2.89 0 0 0-2.924 2.924l.01.89-.636.622a2.89 2.89 0 0 0 0 4.134l.637.622-.011.89a2.89 2.89 0 0 0 2.924 2.924l.89-.01.622.636a2.89 2.89 0 0 0 4.134 0l.622-.637.89.011a2.89 2.89 0 0 0 2.924-2.924l-.01-.89.636-.622a2.89 2.89 0 0 0 0-4.134l-.637-.622.011-.89a2.89 2.89 0 0 0-2.924-2.924l-.89.01z"/>
                                              <path class="capper-verified-check" d="M10.354 6.854a.5.5 0 0 0-.708-.708L7 8.793 5.854 7.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z"/>
                                          </svg>
                                      </span>
                                      {% endif %}
                                  </span>
                                  <span>@{{ expert.username }}</span>
                              </span>
                          </a>
                          <div class="home-best-expert-row-performance">
                              <span class="home-best-expert-roi{% if expert.roi < 0 %} is-negative{% endif %}">ROI {% if expert.roi > 0 %}+{% endif %}{{ expert.roi|floatformat:1 }}%</span>
                              {% if expert.latest_achievements %}
                              <div class="home-best-expert-row-achievements">
                                  {% for achievement in expert.latest_achievements|slice:":4" %}
                                  <span class="home-best-expert-achievement" title="{{ achievement.label }} — {{ achievement.description }}" data-skeleton-image>
                                      <img src="{% static achievement.icon %}" width="28" height="28" alt="" loading="lazy">
                                  </span>
                                  {% endfor %}
                              </div>
                              {% endif %}
                          </div>
                          <div class="home-best-expert-row-stat">
                              <small>Публикации</small>
                              <strong>{{ expert.publications }}</strong>
                          </div>
                          <div class="home-best-expert-row-stat">
                              <small>Подписчики</small>
                              <strong data-followers-count>{{ expert.followers }}</strong>
                          </div>
                          {% include 'front/includes/_home_expert_follow_action.html' with expert=expert action_class='home-best-expert-row-follow' only %}
                      </article>
                      {% endfor %}
                  </div>
              </div>

              <div class="home-best-experts-proof" aria-label="КапперХаб в цифрах">
                  <div class="home-best-experts-proof-lead">
                      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 11a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z"/></svg>
                      <span><strong>Больше, чем прогнозы</strong><small>Реальные результаты. Проверенные эксперты. Сильное сообщество.</small></span>
                  </div>
                  <div class="home-best-experts-proof-item">
                      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/></svg>
                      <span><strong>100+</strong><small>экспертов</small></span>
                  </div>
                  <div class="home-best-experts-proof-item">
                      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M4.5 9a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1zM4 10.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 1 0-1h4a.5.5 0 0 1 0 1z"/></svg>
                      <span><strong>5 000+</strong><small>прогнозов в месяц</small></span>
                  </div>
                  <div class="home-best-experts-proof-item">
                      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/></svg>
                      <span><strong>50 000+</strong><small>активных подписчиков</small></span>
                  </div>
              </div>
              {% else %}
              <div class="home-best-experts-empty">
                  <strong>Прогнозисты скоро появятся</strong>
                  <p>После публикации первых прогнозов рейтинг лучших экспертов автоматически появится здесь.</p>
              </div>
              {% endif %}
          </section>'''

          follow_include = r'''{% if not expert.is_self %}
          {% if expert.paid_predictions_enabled %}
              {% if expert.is_paid_subscribed %}
              <a class="{{ action_class }} is-active" href="{% url 'front:following_feed' %}">В ленту</a>
              {% elif request.user.is_authenticated %}
              <a class="{{ action_class }}" href="{% url 'cabinet:paid_predictions_subscribe' user_id=expert.id %}?next={{ request.path|urlencode }}">Оплатить {{ expert.paid_predictions_price|money }} ₽/мес</a>
              {% else %}
              <a class="{{ action_class }}" href="{% url 'cabinet:login' %}?next={% url 'front:expert_profile' expert.username %}">Оплатить {{ expert.paid_predictions_price|money }} ₽/мес</a>
              {% endif %}
          {% elif request.user.is_authenticated %}
          <button
              class="{{ action_class }}{% if expert.is_following %} is-active{% endif %}"
              type="button"
              data-expert-follow
              data-url="{% url 'cabinet:toggle_follow' user_id=expert.id %}"
              aria-pressed="{% if expert.is_following %}true{% else %}false{% endif %}"
          ><span data-follow-label>{% if expert.is_following %}Вы подписаны{% else %}Подписаться{% endif %}</span></button>
          {% else %}
          <a class="{{ action_class }}" href="{% url 'cabinet:login' %}?next={{ request.path|urlencode }}">Подписаться</a>
          {% endif %}
          {% endif %}
          '''

          main_css = r'''/* Legacy source: front/static/front/css/home-experts.css */
          .home-best-experts {
              width: 100%;
              min-width: 0;
              display: grid;
              gap: 26px;
              margin-top: 26px;
          }

          .home-best-experts-head {
              display: flex;
              align-items: end;
              justify-content: space-between;
              gap: 24px;
          }

          .home-best-experts-head > div {
              min-width: 0;
          }

          .home-best-experts-head h2 {
              margin: 5px 0 10px;
              color: var(--text);
              font-size: clamp(30px, 3.2vw, 46px);
          }

          .home-best-experts-head p:last-child {
              max-width: 760px;
              margin: 0;
              color: var(--soft);
              font-size: 14px;
          }

          .home-best-experts-all {
              min-height: 48px;
              flex: 0 0 auto;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 12px;
              padding: 0 24px;
              border-radius: 12px;
              color: var(--ink);
              background: var(--yellow);
              font-size: 13px;
              font-weight: 800;
          }

          .home-best-experts-all svg {
              width: 18px;
              height: 18px;
              flex: 0 0 18px;
          }

          .home-best-experts-stage {
              min-width: 0;
              display: grid;
              grid-template-columns: minmax(0, 1.12fr) minmax(500px, .88fr);
              align-items: end;
              gap: 28px;
          }

          .home-best-experts-podium {
              min-width: 0;
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              align-items: end;
              gap: 10px;
          }

          .home-best-expert-podium-card {
              min-width: 0;
              display: flex;
              flex-direction: column;
              justify-content: end;
          }

          .home-best-expert-podium-card.is-rank-1 { order: 2; }
          .home-best-expert-podium-card.is-rank-2 { order: 1; }
          .home-best-expert-podium-card.is-rank-3 { order: 3; }

          .home-best-expert-podium-link {
              position: relative;
              z-index: 1;
              min-width: 0;
              display: flex;
              flex-direction: column;
              align-items: center;
              padding: 16px 16px 14px;
              border-radius: 20px 20px 8px 8px;
              background: var(--panel);
              text-align: center;
              box-shadow: 0 14px 34px rgba(0, 0, 0, .2);
          }

          .home-best-expert-podium-card.is-rank-1 .home-best-expert-podium-link {
              min-height: 472px;
              padding-top: 10px;
              box-shadow: 0 18px 44px rgba(251, 241, 16, .08);
          }

          .home-best-expert-podium-card.is-rank-2 .home-best-expert-podium-link,
          .home-best-expert-podium-card.is-rank-3 .home-best-expert-podium-link {
              min-height: 410px;
          }

          .home-best-expert-crown {
              width: 72px;
              height: 58px;
              display: grid;
              place-items: center;
              margin: -48px auto 0;
          }

          .home-best-expert-podium-card.is-rank-1 .home-best-expert-crown {
              margin-top: -58px;
          }

          .home-best-expert-crown img {
              width: 72px;
              height: 58px;
              display: block;
              object-fit: contain;
          }

          .home-best-expert-rank-badge {
              min-width: 42px;
              min-height: 30px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              margin: 0 0 12px;
              padding: 0 10px;
              border-radius: 9px;
              color: var(--ink);
              background: var(--yellow);
              font-size: 13px;
              font-weight: 900;
          }

          .is-rank-2 .home-best-expert-rank-badge {
              background: #cdd5e7;
          }

          .is-rank-3 .home-best-expert-rank-badge {
              background: #f2a15d;
          }

          .home-best-expert-portrait {
              position: relative;
              width: 100%;
              min-height: 126px;
              display: grid;
              place-items: center;
              margin-bottom: 8px;
          }

          .home-best-expert-laurel {
              position: absolute;
              top: 50%;
              width: 78px;
              height: 154px;
              display: grid;
              place-items: center;
              opacity: .34;
              transform: translateY(-50%);
              pointer-events: none;
          }

          .home-best-expert-laurel.is-left { left: 4px; }
          .home-best-expert-laurel.is-right { right: 4px; }

          .home-best-expert-laurel img {
              width: 78px;
              height: 154px;
              display: block;
              object-fit: contain;
          }

          .home-best-expert-avatar {
              position: relative;
              z-index: 2;
              width: 104px;
              height: 104px;
              display: grid;
              place-items: center;
              overflow: hidden;
              border-radius: 50%;
              color: var(--ink);
              background: var(--yellow);
              font-size: 28px;
              font-weight: 900;
              box-shadow: 0 0 0 3px rgba(255, 255, 255, .82);
          }

          .is-rank-1 .home-best-expert-avatar {
              width: 116px;
              height: 116px;
              box-shadow: 0 0 0 4px var(--yellow);
          }

          .home-best-expert-avatar img {
              width: 100%;
              height: 100%;
              display: block;
              object-fit: cover;
          }

          .home-best-expert-verified {
              position: absolute;
              z-index: 3;
              right: calc(50% - 62px);
              bottom: 10px;
          }

          .home-best-expert-roi {
              min-height: 31px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              padding: 0 13px;
              border-radius: 9px;
              color: #fff;
              background: #5ea731;
              font-size: 12px;
              font-weight: 800;
              white-space: nowrap;
          }

          .home-best-expert-roi.is-negative {
              background: var(--danger);
          }

          .home-best-expert-name {
              max-width: 100%;
              overflow: hidden;
              margin-top: 10px;
              color: var(--text);
              font-size: 21px;
              line-height: 1.15;
              white-space: nowrap;
              text-overflow: ellipsis;
          }

          .is-rank-1 .home-best-expert-name {
              font-size: 24px;
          }

          .home-best-expert-username {
              max-width: 100%;
              overflow: hidden;
              margin-top: 4px;
              color: var(--muted);
              font-size: 12px;
              white-space: nowrap;
              text-overflow: ellipsis;
          }

          .home-best-expert-achievements,
          .home-best-expert-row-achievements {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 7px;
          }

          .home-best-expert-achievements {
              min-height: 40px;
              margin-top: 14px;
          }

          .home-best-expert-achievement {
              width: 34px;
              height: 34px;
              display: grid;
              place-items: center;
              overflow: hidden;
              border-radius: 9px;
              background: #171719;
          }

          .home-best-expert-achievement img {
              width: 28px;
              height: 28px;
              display: block;
              object-fit: contain;
          }

          .home-best-expert-stats {
              width: 100%;
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 8px;
              margin-top: auto;
              padding-top: 14px;
          }

          .home-best-expert-stats > span {
              min-width: 0;
              min-height: 66px;
              display: flex;
              flex-direction: column;
              justify-content: center;
              gap: 5px;
              border-radius: 12px;
              background: #171719;
          }

          .home-best-expert-stats small,
          .home-best-expert-row-stat small {
              color: var(--muted);
              font-size: 9px;
              font-weight: 800;
              letter-spacing: .08em;
              text-transform: uppercase;
          }

          .home-best-expert-stats strong {
              color: var(--text);
              font-size: 22px;
          }

          .home-best-expert-podium-card.is-rank-1 .home-best-expert-stats > span:first-child strong {
              color: var(--blue);
          }

          .home-best-expert-follow,
          .home-best-expert-row-follow {
              min-height: 46px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              padding: 0 16px;
              border-radius: 11px;
              color: #fff;
              background: var(--blue);
              font-size: 13px;
              font-weight: 800;
              cursor: pointer;
          }

          button.home-best-expert-follow,
          button.home-best-expert-row-follow {
              appearance: none;
              outline: 0;
              box-shadow: none;
          }

          .home-best-expert-follow {
              position: relative;
              z-index: 2;
              width: calc(100% - 28px);
              margin: -58px auto 12px;
          }

          .home-best-expert-podium-card.is-rank-1 .home-best-expert-follow,
          .home-best-expert-follow.is-active,
          .home-best-expert-row-follow.is-active {
              color: var(--ink);
              background: var(--yellow);
          }

