          .home-best-expert-row {
              min-width: 0;
              min-height: 108px;
              display: grid;
              grid-template-columns: 38px minmax(180px, 1.4fr) minmax(150px, 1fr) 72px 80px minmax(112px, auto);
              align-items: center;
