name: Refine bookmaker placement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refine-bookmaker-placement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        run: python .github/scripts/refine_bookmaker_placement.py

      - name: Remove one-shot files
        run: rm -f .github/workflows/refine-bookmaker-placement.yml .github/scripts/refine_bookmaker_placement.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplify bookmaker placement settings"
          git push origin main
