name: Fix match header and detail alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-match-header-detail-alignment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final alignment styles
        run: python .github/scripts/apply_match_header_detail_alignment.py

      - name: Remove one-shot files
        run: rm -f .github/scripts/apply_match_header_detail_alignment.py .github/workflows/fix-match-header-detail-alignment.yml

      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: center match odds and bookmaker header'
          git push
