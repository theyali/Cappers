name: Apply prediction comments reference design

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prediction-comments-reference-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused prediction comments patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          template_path = Path("templates/front/prediction_detail.html")
          template = template_path.read_text(encoding="utf-8")
          template_pattern = re.compile(
              r'                <section\n                    class="prediction-comments".*?                </section>',
              re.S,
          )
          template_replacement = '''                <section
                    class="prediction-comments"
                    id="comments"
                    data-prediction-comments
                    data-prediction-id="{{ coupon.id }}"
                    data-author-id="{{ coupon.author_id }}"
                    data-comments-url="{% url 'front:prediction_comments' prediction_id=coupon.id %}"
                    data-delete-url-template="{% url 'front:comment_delete' comment_id=0 %}"
                    data-previous-page="{{ comments_previous_page|default:'' }}"
                    aria-labelledby="prediction-comments-title"
                >
                    <header class="prediction-comments-head">
                        <h2 id="prediction-comments-title">Комментарии</h2>
                        <span class="prediction-comments-total" aria-live="polite">
                            <strong data-comments-total>{{ coupon.comments_count }}</strong>
                            <span data-comments-total-label>комментариев</span>
                        </span>
                    </header>

                    {% if request.user.is_authenticated %}
                    <form class="prediction-comment-form" data-comment-form novalidate>
                        <span class="prediction-comment-avatar"{% if request.user.avatar %} data-skeleton-image{% endif %}>
                            {% if request.user.avatar %}
                                <img src="{{ request.user.avatar.url }}" width="52" height="52" loading="lazy" alt="">
                            {% else %}
                                {{ request.user.username|slice:":1"|upper }}
                            {% endif %}
                        </span>
                        <label for="prediction-comment-text-{{ coupon.id }}">Ваш комментарий</label>
                        <textarea
                            id="prediction-comment-text-{{ coupon.id }}"
                            name="text"
                            rows="1"
                            maxlength="1000"
                            placeholder="Напишите комментарий..."
                            data-comment-text
                        ></textarea>
                        <p class="prediction-comment-feedback" data-comment-feedback role="status" aria-live="polite" hidden></p>
                        <button
                            class="prediction-comment-submit"
                            type="submit"
                            data-comment-submit
                            aria-label="Отправить комментарий"
                            disabled
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"></path>
                            </svg>
                            <span>Отправить</span>
                        </button>
                    </form>
                    {% else %}
                    <div class="prediction-comments-auth">
                        <strong>Хотите участвовать в обсуждении?</strong>
                        <span>Войдите в аккаунт, чтобы оставить комментарий.</span>
                        <a href="{% url 'cabinet:login' %}?next={{ request.get_full_path|urlencode }}">Войти</a>
                    </div>
                    {% endif %}

                    <p class="prediction-comments-load-error" data-comments-load-error role="alert" hidden></p>

                    <div
                        class="prediction-comments-list"
                        data-comments-list
                        data-skeleton-block
                        aria-live="polite"
                        aria-busy="false"
                    >
                        {% for comment in initial_comments %}
                        <article class="prediction-comment" data-comment-id="{{ comment.id }}">
                            <span class="prediction-comment-avatar"{% if comment.user.avatar %} data-skeleton-image{% endif %}>
                                {% if comment.user.avatar %}
                                    <img src="{{ comment.user.avatar.url }}" width="52" height="52" loading="lazy" alt="">
                                {% else %}
                                    {{ comment.user.username|slice:":1"|upper }}
                                {% endif %}
                            </span>
                            <div class="prediction-comment-meta">
                                <strong>{% firstof comment.user.get_full_name comment.user.username %}</strong>
                                {% if comment.user_id == coupon.author_id %}
                                <span class="prediction-comment-author-badge">Автор</span>
                                {% endif %}
                                <time datetime="{{ comment.created_at|date:'c' }}">{{ comment.created_at|timesince }} назад</time>
                            </div>
                            {% if comment.can_delete %}
                            <button
                                class="prediction-comment-delete"
                                type="button"
                                data-comment-delete="{{ comment.id }}"
                                aria-label="Удалить комментарий пользователя {% firstof comment.user.get_full_name comment.user.username %}"
                            >
                                Удалить
                            </button>
                            {% endif %}
                            <p class="prediction-comment-text">{{ comment.text }}</p>
                        </article>
                        {% empty %}
                        <div class="prediction-comments-empty">
                            <strong>Пока нет комментариев</strong>
                            <span>Будьте первым, кто обсудит этот прогноз.</span>
                        </div>
                        {% endfor %}
                    </div>

                    <button class="prediction-comments-more" type="button" data-comments-more hidden>
                        Показать ещё комментарии
                    </button>
                </section>'''
          template, template_count = template_pattern.subn(
              lambda _: template_replacement,
              template,
              count=1,
          )
          if template_count != 1:
              raise SystemExit(f"prediction comments template block matches: {template_count}")
          template_path.write_text(template, encoding="utf-8")

          css_path = Path("front/static/front/css/main.css")
          css = css_path.read_text(encoding="utf-8")
          css_pattern = re.compile(
              r'/\* Prediction detail comments \*/.*?(?=\n\n/\* Consolidated former temp\.css overrides \*/)',
              re.S,
          )
          css_replacement = '''/* Prediction detail comments */
.prediction-comments {
    display: grid;
    gap: 22px;
    padding: 28px;
    border-radius: 24px;
    background: var(--panel);
}

.prediction-comments-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
}

.prediction-comments-head h2 {
    margin: 0;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 28px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
}

.prediction-comments-total {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
}

.prediction-comments-total strong {
    color: inherit;
    font-size: inherit;
    font-weight: 800;
}

.prediction-comment-form {
    position: relative;
    min-height: 56px;
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    align-items: center;
    gap: 14px;
}

.prediction-comment-form label,
.prediction-comment-submit span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
}

.prediction-comment-form textarea {
    width: 100%;
    height: 56px;
    min-height: 56px;
    max-height: 120px;
    resize: none;
    padding: 17px 68px 17px 18px;
    border: 0;
    border-radius: 14px;
    outline: 0;
    color: var(--text);
    background: #29292d;
    font-size: 15px;
    line-height: 22px;
}

.prediction-comment-form textarea::placeholder {
    color: #8a8a8d;
}

.prediction-comment-form textarea:focus {
    background: #303034;
}

.prediction-comment-form textarea:disabled {
    opacity: .65;
    cursor: wait;
}

.prediction-comment-feedback,
.prediction-comments-load-error {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
}

.prediction-comment-feedback {
    grid-column: 2;
    padding-right: 58px;
}

.prediction-comment-feedback.is-error,
.prediction-comments-load-error {
    color: #ff6f61;
}

.prediction-comment-feedback.is-rate-limit {
    color: var(--yellow);
}

.prediction-comment-feedback.is-success {
    color: #8fd26a;
}

.prediction-comment-submit,
.prediction-comments-more,
.prediction-comments-auth a,
.prediction-comment-delete {
    border: 0;
    cursor: pointer;
    font: inherit;
}

.prediction-comment-submit {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 9px;
    color: #fff;
    background: var(--blue);
}

.prediction-comment-submit svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.prediction-comment-submit:disabled {
    color: #fff;
    background: var(--blue);
    opacity: .62;
    cursor: not-allowed;
}

.prediction-comments-auth {
    display: grid;
    gap: 8px;
    padding: 16px;
    border-radius: 14px;
    background: #29292d;
}

.prediction-comments-auth span {
    color: var(--muted);
    font-size: 13px;
}

.prediction-comments-auth a {
    width: fit-content;
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    padding: 0 15px;
    border-radius: 10px;
    color: #fff;
    background: var(--blue);
    font-weight: 800;
}

.prediction-comments-list {
    min-height: 300px;
    display: grid;
    align-content: start;
}

.prediction-comment {
    position: relative;
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) 32px;
    column-gap: 14px;
    row-gap: 7px;
    padding: 17px 0 21px;
    background: transparent;
}

.prediction-comment::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    left: 66px;
    height: 1px;
    background: rgba(255, 255, 255, .08);
}

.prediction-comment:last-child::after {
    display: none;
}

.prediction-comment-avatar {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 50%;
    color: var(--ink);
    background: var(--yellow);
    font-size: 13px;
    font-weight: 900;
}

.prediction-comment-avatar img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.prediction-comment-meta {
    min-width: 0;
    display: flex;
    align-items: center;
    align-self: start;
    flex-wrap: wrap;
    gap: 6px 10px;
    min-height: 26px;
}

.prediction-comment-meta strong {
    min-width: 0;
    overflow: hidden;
    color: var(--text);
    font-size: 15px;
    font-weight: 800;
    line-height: 1.25;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.prediction-comment-meta time {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.25;
    white-space: nowrap;
}

.prediction-comment-author-badge {
    min-height: 20px;
    display: inline-flex;
    align-items: center;
    padding: 0 6px;
    border-radius: 5px;
    color: var(--ink);
    background: #9aa0a8;
    font-size: 10px;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
}

.prediction-comment-text {
    grid-column: 2 / -1;
    margin: 0;
    padding-right: 8px;
    color: rgba(255, 255, 255, .82);
    font-size: 15px;
    line-height: 1.55;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.prediction-comment-delete {
    grid-column: 3;
    grid-row: 1;
    align-self: start;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 8px;
    color: #8a919b;
    background: transparent;
    font-size: 0;
}

.prediction-comment-delete::before {
    content: "⋮";
    font-size: 24px;
    font-weight: 800;
    line-height: 1;
}

.prediction-comment-delete:hover {
    color: #fff;
    background: transparent;
}

.prediction-comment-delete:disabled {
    opacity: .55;
    cursor: wait;
}

.prediction-comments-empty {
    min-height: 300px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 6px;
    padding: 24px;
    border-radius: 14px;
    color: var(--muted);
    background: #252527;
    text-align: center;
}

.prediction-comments-empty strong {
    color: var(--text);
}

.prediction-comments-more {
    width: 100%;
    min-height: 52px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    justify-self: stretch;
    padding: 0 18px;
    border-radius: 10px;
    color: var(--text);
    background: #29292d;
    font-size: 14px;
    font-weight: 800;
}

.prediction-comments-more:hover {
    background: #343438;
}

.prediction-comments-more:disabled {
    opacity: .55;
    cursor: wait;
}

@media (max-width: 640px) {
    .prediction-comments {
        gap: 18px;
        padding: 18px;
        border-radius: 18px;
    }

    .prediction-comments-head {
        align-items: flex-start;
    }

    .prediction-comments-head h2 {
        font-size: 24px;
    }

    .prediction-comments-total {
        padding-top: 5px;
        font-size: 11px;
    }

    .prediction-comment-form {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 10px;
        min-height: 52px;
    }

    .prediction-comment-form .prediction-comment-avatar {
        width: 44px;
        height: 44px;
    }

    .prediction-comment-form textarea {
        height: 52px;
        min-height: 52px;
        padding: 15px 60px 15px 14px;
        font-size: 14px;
    }

    .prediction-comment-submit {
        top: 6px;
        right: 6px;
        width: 40px;
        height: 40px;
    }

    .prediction-comments-list,
    .prediction-comments-empty {
        min-height: 260px;
    }

    .prediction-comment {
        grid-template-columns: 46px minmax(0, 1fr) 28px;
        column-gap: 11px;
        padding: 15px 0 18px;
    }

    .prediction-comment > .prediction-comment-avatar {
        width: 46px;
        height: 46px;
    }

    .prediction-comment::after {
        left: 57px;
    }

    .prediction-comment-meta {
        gap: 5px 8px;
    }

    .prediction-comment-meta strong,
    .prediction-comment-text {
        font-size: 14px;
    }

    .prediction-comment-meta time {
        font-size: 12px;
    }

    .prediction-comment-delete {
        width: 28px;
        height: 28px;
    }

    .prediction-comment-text {
        padding-right: 0;
    }
}
'''
          css, css_count = css_pattern.subn(lambda _: css_replacement, css, count=1)
          if css_count != 1:
              raise SystemExit(f"prediction comments css block matches: {css_count}")
          css_path.write_text(css, encoding="utf-8")

          js_path = Path("front/static/front/js/comments.js")
          js = js_path.read_text(encoding="utf-8")
          js = js.replace(
              '    const predictionId = root.dataset.predictionId || "";\n',
              '    const predictionId = root.dataset.predictionId || "";\n    const authorId = root.dataset.authorId || "";\n',
              1,
          )
          js = js.replace(
              '    let submitting = false;\n',
              '    let submitting = false;\n    let totalCount = Number.parseInt(totalNode?.textContent || "0", 10) || 0;\n',
              1,
          )
          js = js.replace(
              '    const totalNode = root.querySelector("[data-comments-total]");\n',
              '    const totalNode = root.querySelector("[data-comments-total]");\n    const totalLabel = root.querySelector("[data-comments-total-label]");\n',
              1,
          )
          old_counter = '''        if (totalNode) totalNode.textContent = String(safeCount);\n\n        document.querySelectorAll("[data-comment-count]").forEach((node) => {'''
          new_counter = '''        totalCount = safeCount;\n        if (totalNode) totalNode.textContent = String(safeCount);\n        if (totalLabel) {\n            totalLabel.textContent = russianPlural(safeCount, "комментарий", "комментария", "комментариев");\n        }\n\n        document.querySelectorAll("[data-comment-count]").forEach((node) => {'''
          if old_counter not in js:
              raise SystemExit("comments counter block not found")
          js = js.replace(old_counter, new_counter, 1)

          date_pattern = re.compile(
              r'    const formatDate = \(value\) => \{.*?\n    \};\n\n    const initialsFor',
              re.S,
          )
          date_replacement = '''    const russianPlural = (value, one, few, many) => {\n        const absolute = Math.abs(Number(value) || 0);\n        const mod100 = absolute % 100;\n        const mod10 = absolute % 10;\n        if (mod100 >= 11 && mod100 <= 14) return many;\n        if (mod10 === 1) return one;\n        if (mod10 >= 2 && mod10 <= 4) return few;\n        return many;\n    };\n\n    const formatDate = (value) => {\n        if (!value) return "";\n        const date = new Date(value);\n        if (Number.isNaN(date.getTime())) return "";\n\n        const diffMs = Math.max(0, Date.now() - date.getTime());\n        const minutes = Math.floor(diffMs / 60000);\n        if (minutes < 1) return "только что";\n        if (minutes < 60) {\n            return `${minutes} ${russianPlural(minutes, "минуту", "минуты", "минут")} назад`;\n        }\n\n        const hours = Math.floor(minutes / 60);\n        if (hours < 24) {\n            return `${hours} ${russianPlural(hours, "час", "часа", "часов")} назад`;\n        }\n\n        const days = Math.floor(hours / 24);\n        if (days < 7) {\n            return `${days} ${russianPlural(days, "день", "дня", "дней")} назад`;\n        }\n\n        return new Intl.DateTimeFormat("ru-RU", {\n            day: "2-digit",\n            month: "2-digit",\n            year: "numeric",\n        }).format(date);\n    };\n\n    const initialsFor'''
          js, date_count = date_pattern.subn(lambda _: date_replacement, js, count=1)
          if date_count != 1:
              raise SystemExit(f"comments date formatter matches: {date_count}")

          js = js.replace('            image.width = 40;\n            image.height = 40;\n', '            image.width = 52;\n            image.height = 52;\n', 1)

          meta_old = '''        const author = document.createElement("strong");\n        author.textContent = displayName;\n\n        const time = document.createElement("time");\n        time.dateTime = comment.created_at || "";\n        time.textContent = formatDate(comment.created_at);\n\n        meta.append(author, time);'''
          meta_new = '''        const author = document.createElement("strong");\n        author.textContent = displayName;\n\n        const time = document.createElement("time");\n        time.dateTime = comment.created_at || "";\n        time.textContent = formatDate(comment.created_at);\n\n        meta.append(author);\n        if (String(comment.user?.id || "") === authorId) {\n            const authorBadge = document.createElement("span");\n            authorBadge.className = "prediction-comment-author-badge";\n            authorBadge.textContent = "Автор";\n            meta.append(authorBadge);\n        }\n        meta.append(time);'''
          if meta_old not in js:
              raise SystemExit("comments author meta block not found")
          js = js.replace(meta_old, meta_new, 1)

          more_old = '''    const syncMoreButton = () => {\n        if (!moreButton) return;\n        moreButton.hidden = !previousPage;\n        moreButton.disabled = loading;\n    };'''
          more_new = '''    const syncMoreButton = () => {\n        if (!moreButton) return;\n        moreButton.hidden = !previousPage;\n        moreButton.disabled = loading;\n        if (!previousPage) return;\n\n        const shownCount = list?.querySelectorAll(".prediction-comment").length || 0;\n        const remaining = Math.max(0, totalCount - shownCount);\n        moreButton.textContent = `Показать ещё комментарии${remaining ? ` (${remaining})` : ""}`;\n    };'''
          if more_old not in js:
              raise SystemExit("comments more button block not found")
          js = js.replace(more_old, more_new, 1)

          init_old = '''    syncComposer();\n    syncMoreButton();\n})();'''
          init_new = '''    updateCounters(totalCount);\n    syncComposer();\n    syncMoreButton();\n})();'''
          if init_old not in js:
              raise SystemExit("comments init block not found")
          js = js.replace(init_old, init_new, 1)
          js_path.write_text(js, encoding="utf-8")

          comment_views_path = Path("front/comment_views.py")
          comment_views = comment_views_path.read_text(encoding="utf-8")
          if comment_views.count("COMMENTS_PAGE_SIZE = 20") != 1:
              raise SystemExit("unexpected COMMENTS_PAGE_SIZE source")
          comment_views = comment_views.replace("COMMENTS_PAGE_SIZE = 20", "COMMENTS_PAGE_SIZE = 3", 1)
          comment_views_path.write_text(comment_views, encoding="utf-8")

          prediction_views_path = Path("front/prediction_views.py")
          prediction_views = prediction_views_path.read_text(encoding="utf-8")
          if prediction_views.count("comments_page_size = 20") != 1:
              raise SystemExit("unexpected prediction comments page size source")
          prediction_views = prediction_views.replace("comments_page_size = 20", "comments_page_size = 3", 1)
          prediction_views_path.write_text(prediction_views, encoding="utf-8")
          PY

          node --check front/static/front/js/comments.js
          python -m py_compile front/comment_views.py front/prediction_views.py
          git diff --check

      - name: Commit focused changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prediction-comments-reference-patch.yml
          git add templates/front/prediction_detail.html front/static/front/css/main.css front/static/front/js/comments.js front/comment_views.py front/prediction_views.py
          git diff --cached --check
          git commit -m "feat: match prediction comments reference design"
          git push origin HEAD:main
