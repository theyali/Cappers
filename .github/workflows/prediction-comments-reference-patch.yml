name: Apply prediction comments reference design

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prediction-comments-reference-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        run: python .github/prediction_comments_reference_patch.py

      - name: Validate changed files
        run: |
          node --check front/static/front/js/comments.js
          python -m py_compile front/comment_views.py front/prediction_views.py
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prediction-comments-reference-patch.yml
          git rm .github/prediction_comments_reference_patch.py
          git add templates/front/prediction_detail.html front/static/front/css/main.css front/static/front/js/comments.js front/comment_views.py front/prediction_views.py
          git diff --cached --check
          git commit -m "feat: match prediction comments reference design"
          git push origin HEAD:main
