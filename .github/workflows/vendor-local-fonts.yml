name: Vendor local fonts

on:
  push:
    paths:
      - ".github/workflows/vendor-local-fonts.yml"

permissions:
  contents: write

jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download optimized WOFF2 subsets
        shell: bash
        run: |
          set -euo pipefail
          target="front/static/front/fonts"
          mkdir -p "$target"

          manrope="https://raw.githubusercontent.com/fontsource/font-files/main/fonts/variable/manrope/files"
          russo="https://raw.githubusercontent.com/fontsource/font-files/main/fonts/google/russo-one/files"

          curl --fail --location --silent --show-error "$manrope/manrope-cyrillic-wght-normal.woff2" -o "$target/manrope-cyrillic-wght-normal.woff2"
          curl --fail --location --silent --show-error "$manrope/manrope-latin-ext-wght-normal.woff2" -o "$target/manrope-latin-ext-wght-normal.woff2"
          curl --fail --location --silent --show-error "$manrope/manrope-latin-wght-normal.woff2" -o "$target/manrope-latin-wght-normal.woff2"

          curl --fail --location --silent --show-error "$russo/russo-one-cyrillic-400-normal.woff2" -o "$target/russo-one-cyrillic-400-normal.woff2"
          curl --fail --location --silent --show-error "$russo/russo-one-latin-ext-400-normal.woff2" -o "$target/russo-one-latin-ext-400-normal.woff2"
          curl --fail --location --silent --show-error "$russo/russo-one-latin-400-normal.woff2" -o "$target/russo-one-latin-400-normal.woff2"

          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt" -o "$target/OFL-Manrope.txt"
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/google/fonts/main/ofl/russoone/OFL.txt" -o "$target/OFL-Russo-One.txt"

          test -s "$target/manrope-cyrillic-wght-normal.woff2"
          test -s "$target/manrope-latin-ext-wght-normal.woff2"
          test -s "$target/manrope-latin-wght-normal.woff2"
          test -s "$target/russo-one-cyrillic-400-normal.woff2"
          test -s "$target/russo-one-latin-ext-400-normal.woff2"
          test -s "$target/russo-one-latin-400-normal.woff2"

      - name: Commit local font files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/static/front/fonts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Vendor optimized local Manrope and Russo One fonts"
          git push origin HEAD:main
