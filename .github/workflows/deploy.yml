name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python - <<'PY'
          from os import environ
          from pathlib import Path
          missing = [
              name
              for name in ("DEPLOY_HOST", "DEPLOY_SSH_KEY", "DEPLOY_USER")
              if not environ.get(name)
          ]
          if missing:
              raise SystemExit(f"Missing GitHub secrets: {', '.join(missing)}")
          key = environ["DEPLOY_SSH_KEY"].strip()
          if key.startswith('"') and key.endswith('"'):
              key = key[1:-1]
          key = key.replace("\\r", "").replace("\\n", "\n")
          if not key.endswith("\n"):
              key += "\n"
          Path.home().joinpath(".ssh", "deploy_key").write_text(key)
          PY
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          echo "DEPLOY_PORT_RESOLVED=${PORT}" >> "$GITHUB_ENV"
          if ! ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Could not read SSH host key from ${DEPLOY_HOST}:${PORT}"
            exit 1
          fi

      - name: Verify SSH Login
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Missing GitHub secret: DEPLOY_PATH"
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -p "${DEPLOY_PORT_RESOLVED}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; echo 'ssh connected'; test -d '${DEPLOY_PATH}' || { echo 'DEPLOY_PATH does not exist: ${DEPLOY_PATH}'; exit 10; }; echo 'deploy path ok'; git -C '${DEPLOY_PATH}' rev-parse --is-inside-work-tree; echo 'git repo ok'"

      - name: Resolve Deployed Revision
        id: deployed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          DEPLOYED_REV="$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -p "${DEPLOY_PORT_RESOLVED}" "${DEPLOY_USER}@${DEPLOY_HOST}" "git -C '${DEPLOY_PATH}' rev-parse HEAD" 2>/dev/null || true)"
          echo "rev=${DEPLOYED_REV}" >> "$GITHUB_OUTPUT"

      - name: Compute Deploy Scope
        id: scope
        env:
          DEPLOYED_REV: ${{ steps.deployed.outputs.rev }}
        run: |
          set -euo pipefail

          build=0
          full_recreate=0
          restart_app=0
          restart_nginx=0

          if [ -z "${DEPLOYED_REV}" ]; then
            echo "No deployed revision found on server. Falling back to full deploy."
            build=1
            full_recreate=1
            restart_app=1
            restart_nginx=1
          elif ! git cat-file -e "${DEPLOYED_REV}^{commit}" 2>/dev/null; then
            echo "Deployed revision is missing in local git history. Falling back to full deploy."
            build=1
            full_recreate=1
            restart_app=1
            restart_nginx=1
          else
            echo "Deployed revision: ${DEPLOYED_REV}"
            echo "Target revision:   ${GITHUB_SHA}"
            CHANGED_FILES="$(git diff --name-only "${DEPLOYED_REV}" "${GITHUB_SHA}" || true)"

            echo "Changed files:"
            if [ -n "${CHANGED_FILES}" ]; then
              printf '%s\n' "${CHANGED_FILES}"
            else
              echo "(none)"
            fi

            CHANGED_FILE_LIST="$(mktemp)"
            printf '%s\n' "${CHANGED_FILES}" > "${CHANGED_FILE_LIST}"

            while IFS= read -r file; do
              [ -n "${file}" ] || continue

              case "${file}" in
                Dockerfile|requirements.txt|entrypoint.sh|.dockerignore)
                  build=1
                  restart_app=1
                  ;;
                docker-compose.yml|deploy/postgres/*|deploy/pgbouncer/*)
                  full_recreate=1
                  restart_app=1
                  restart_nginx=1
                  ;;
                deploy/deploy.sh)
                  restart_nginx=1
                  ;;
                deploy/nginx/*)
                  restart_nginx=1
                  ;;
                manage.py|cappers/*|front/*|back/*|pages/*|game/*|cabinet/*|tournaments/*|notifications/*|wallets/*|bots/*|account_email/*|achievements/*|templates/*)
                  restart_app=1
                  ;;
              esac
            done < "${CHANGED_FILE_LIST}"

            rm -f "${CHANGED_FILE_LIST}"
          fi

          if [ "${full_recreate}" = "1" ]; then
            restart_app=1
            restart_nginx=1
          fi

          if [ "${build}" = "1" ]; then
            restart_app=1
          fi

          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "full_recreate=${full_recreate}" >> "$GITHUB_OUTPUT"
          echo "restart_app=${restart_app}" >> "$GITHUB_OUTPUT"
          echo "restart_nginx=${restart_nginx}" >> "$GITHUB_OUTPUT"

          echo "Deploy scope: build=${build} full_recreate=${full_recreate} restart_app=${restart_app} restart_nginx=${restart_nginx}"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_BUILD: ${{ steps.scope.outputs.build }}
          DEPLOY_FULL_RECREATE: ${{ steps.scope.outputs.full_recreate }}
          DEPLOY_RESTART_APP: ${{ steps.scope.outputs.restart_app }}
          DEPLOY_RESTART_NGINX: ${{ steps.scope.outputs.restart_nginx }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -p "${DEPLOY_PORT_RESOLVED}" "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            git fetch origin main
            git reset --hard origin/main
            DEPLOY_BUILD="${DEPLOY_BUILD}" \
            DEPLOY_FULL_RECREATE="${DEPLOY_FULL_RECREATE}" \
            DEPLOY_RESTART_APP="${DEPLOY_RESTART_APP}" \
            DEPLOY_RESTART_NGINX="${DEPLOY_RESTART_NGINX}" \
            DEPLOY_PRUNE="1" \
            bash deploy/deploy.sh
          EOF
