name: Apply feed status and confidence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-feed-status-confidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update feed prediction status styles
        run: |
          python3 -c "from pathlib import Path; p=Path('front/static/front/css/main.css'); s=p.read_text(); m='.feed-prediction-cover-status,'; i=s.rindex(m); p.write_text(s[:i]+'.feed-prediction-cover-status,\n.feed-prediction-cover-confidence {\n    position: absolute;\n    top: 18px;\n    z-index: 4;\n}\n\n.feed-prediction-cover-status {\n    left: 18px;\n    width: 48px;\n    height: 48px;\n    display: grid;\n    place-items: center;\n    padding: 0;\n    border-radius: 14px;\n    color: var(--yellow);\n    background: var(--ink);\n}\n\n.feed-prediction-cover-status svg {\n    width: 25px;\n    height: 25px;\n    display: block;\n    fill: none;\n    stroke: currentColor;\n    stroke-width: 2.2;\n    stroke-linecap: round;\n    stroke-linejoin: round;\n}\n\n.feed-prediction-cover-status.is-win {\n    color: #fff;\n    background: var(--green);\n}\n\n.feed-prediction-cover-status.is-win .feed-prediction-status-icon-bg {\n    fill: #4f972b;\n    stroke: none;\n}\n\n.feed-prediction-cover-status.is-win .feed-prediction-status-icon-mark {\n    fill: none;\n    stroke: #fff;\n    stroke-width: 2.3;\n}\n\n.feed-prediction-cover-status.is-lose {\n    color: #fff;\n    background: var(--danger);\n}\n\n.feed-prediction-cover-status.is-refund {\n    color: #fff;\n    background: var(--blue);\n}\n\n.feed-prediction-cover-confidence {\n    right: 18px;\n    width: 104px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 7px;\n    color: #fff;\n    background: transparent;\n    text-align: center;\n}\n\n.feed-prediction-confidence-ring {\n    position: relative;\n    width: 88px;\n    height: 88px;\n    display: grid;\n    place-items: center;\n    border-radius: 50%;\n    background: #101114;\n}\n\n.feed-prediction-confidence-ring svg {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    display: block;\n    overflow: visible;\n    transform: rotate(-90deg);\n}\n\n.feed-prediction-confidence-track,\n.feed-prediction-confidence-progress {\n    fill: none;\n    stroke-width: 5;\n}\n\n.feed-prediction-confidence-track {\n    stroke: #2b3036;\n}\n\n.feed-prediction-confidence-progress {\n    stroke: #1595ff;\n    stroke-linecap: butt;\n}\n\n.feed-prediction-cover-confidence strong {\n    position: relative;\n    z-index: 1;\n    color: #fff;\n    font-size: 22px;\n    font-weight: 700;\n    line-height: 1;\n}\n\n.feed-prediction-cover-confidence > span:last-child {\n    color: rgba(255, 255, 255, .58);\n    font-size: 11px;\n    font-weight: 600;\n    line-height: 1.1;\n}\n\n@media (max-width: 760px) {\n    .feed-prediction-cover-status,\n    .feed-prediction-cover-confidence {\n        top: 12px;\n    }\n\n    .feed-prediction-cover-status {\n        left: 12px;\n        width: 42px;\n        height: 42px;\n        border-radius: 12px;\n    }\n\n    .feed-prediction-cover-status svg {\n        width: 22px;\n        height: 22px;\n    }\n\n    .feed-prediction-cover-confidence {\n        right: 12px;\n        width: 86px;\n        gap: 5px;\n    }\n\n    .feed-prediction-confidence-ring {\n        width: 72px;\n        height: 72px;\n    }\n\n    .feed-prediction-confidence-track,\n    .feed-prediction-confidence-progress {\n        stroke-width: 4.5;\n    }\n\n    .feed-prediction-cover-confidence strong {\n        font-size: 18px;\n    }\n\n    .feed-prediction-cover-confidence > span:last-child {\n        font-size: 9px;\n    }\n}\n')"

      - name: Commit changes
        run: |
          git config user.name "Ali Hajiyev"
          git config user.email "83508265+theyali@users.noreply.github.com"
          git add front/static/front/css/main.css
          git diff --cached --quiet && exit 0
          git commit -m "Refine feed status icons and confidence ring"
          git push origin main
