name: Run forecast reference patch

on:
  push:
    paths:
      - ".github/workflows/run-forecast-patch-helper.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply embedded forecast patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/patch-forecast-reference-v2.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          code = text[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in code.splitlines())
          exec(compile(code, str(source), 'exec'))

          helper = Path('.github/workflows/run-forecast-patch-helper.yml')
          if helper.exists():
              helper.unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix home forecast block to match reference"
          git push
