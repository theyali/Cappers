server {
    listen 80;
    listen [::]:80;
    server_name capper-hub.com www.capper-hub.com cuppershub.com www.cuppershub.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://capper-hub.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name capper-hub.com www.capper-hub.com cuppershub.com www.cuppershub.com;

    ssl_certificate /etc/letsencrypt/live/capper-hub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capper-hub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host != "capper-hub.com") {
        return 301 https://capper-hub.com$request_uri;
    }

    location /media/ {
        alias /home/deploy/Cappers/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
